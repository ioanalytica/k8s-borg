{{- $hasConfig := false }}
{{- range .Values.databases.mongodb.instances }}{{- if .config }}{{- $hasConfig = true }}{{- end }}{{- end }}
{{- if and .Values.databases.mongodb.enabled (not .Values.databases.mongodb.existingSecret) $hasConfig }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ printf "%s-mongodb" (include "common.names.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
stringData:
  {{- range .Values.databases.mongodb.instances }}
  {{- if .config }}
  {{ .name }}.conf: |
    {{- .config | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
