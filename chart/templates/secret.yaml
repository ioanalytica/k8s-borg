{{- /*
Copyright IO ANALYTICA. All Rights Reserved.
SPDX-License-Identifier: Apache-2.0

Holds only the sensitive values that are NOT sourced from a per-field
existingSecret. Rendered only when at least one such value is chart-managed.
*/}}
{{- $repoBaseManaged := not .Values.borg.repoBase.existingSecret -}}
{{- $passphraseManaged := not .Values.borg.passphrase.existingSecret -}}
{{- $s3KeyManaged := and .Values.s3.enabled (not .Values.s3.accessKey.existingSecret) -}}
{{- $s3SecretManaged := and .Values.s3.enabled (not .Values.s3.secretKey.existingSecret) -}}
{{- $anyAgent := include "k8s-borg.anyAgent" . -}}
{{- $adminManaged := and (or .Values.borgUI.enabled $anyAgent) (not .Values.borgUI.adminPassword.existingSecret) (or .Values.borgUI.adminPassword.value $anyAgent) -}}
{{- $oidcSecretManaged := and .Values.borgUI.enabled .Values.borgUI.oidc.enabled .Values.borgUI.oidc.clientSecret.value (not .Values.borgUI.oidc.clientSecret.existingSecret) -}}
{{- if or $repoBaseManaged $passphraseManaged $s3KeyManaged $s3SecretManaged $adminManaged $oidcSecretManaged }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
stringData:
  {{- if $repoBaseManaged }}
  BORG_REPO_BASE: {{ required "borg.repoBase.value is required (or set borg.repoBase.existingSecret)" .Values.borg.repoBase.value | quote }}
  {{- end }}
  {{- if $passphraseManaged }}
  BORG_PASSPHRASE: {{ required "borg.passphrase.value is required (or set borg.passphrase.existingSecret)" .Values.borg.passphrase.value | quote }}
  {{- end }}
  {{- if $s3KeyManaged }}
  AWS_KEY: {{ .Values.s3.accessKey.value | quote }}
  {{- end }}
  {{- if $s3SecretManaged }}
  AWS_SECRET_KEY: {{ .Values.s3.secretKey.value | quote }}
  {{- end }}
  {{- if $adminManaged }}
  BORG_UI_ADMIN_PASS: {{ .Values.borgUI.adminPassword.value | quote }}
  {{- end }}
  {{- if $oidcSecretManaged }}
  OIDC_CLIENT_SECRET: {{ .Values.borgUI.oidc.clientSecret.value | quote }}
  {{- end }}
{{- end }}
