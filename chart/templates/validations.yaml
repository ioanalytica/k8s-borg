{{- if not (has .Values.node.backupMode (list "interval" "agent")) }}
{{- fail (printf "node.backupMode must be \"interval\" or \"agent\" (got %q)" .Values.node.backupMode) }}
{{- end }}
{{- if not (has .Values.cluster.backupMode (list "cronjob" "plan")) }}
{{- fail (printf "cluster.backupMode must be \"cronjob\" or \"plan\" (got %q)" .Values.cluster.backupMode) }}
{{- end }}
{{- if .Values.app }}
{{- fail "The `app` section has moved into `cluster` (chart 1.0.21): rename app.mode->cluster.mode, app.agentScripts->cluster.agentScripts, and drop app.enabled/app.nodeName/app.resources/app.* (the console pod now shares cluster.nodeName/resources/extraVolumes/etc. with the CronJob). See chart/README.md." }}
{{- end }}
{{- if .Values.config }}
{{- fail "The `config` section has moved into `node`/`cluster` (chart 1.0.21): config.clusterInclude->cluster.include, config.clusterExclude->cluster.exclude, config.s3Buckets->cluster.s3Buckets, config.nodeInclude->node.include, config.nodeExclude->node.exclude. See chart/README.md." }}
{{- end }}
{{- if not (has .Values.cluster.mode (list "legacy" "agent")) }}
{{- fail (printf "cluster.mode must be \"legacy\" or \"agent\" (got %q)" .Values.cluster.mode) }}
{{- end }}
{{- if and .Values.cluster.enabled (eq .Values.cluster.backupMode "plan") }}
{{- if ne .Values.cluster.mode "agent" }}
{{- fail "cluster.backupMode=plan registers a server-side BackupPlan via the console pod — it requires cluster.mode=agent (or use cluster.backupMode=cronjob)" }}
{{- end }}
{{- end }}
{{- if not (has .Values.borgUI.redis.mode (list "disabled" "internal" "external")) }}
{{- fail (printf "borgUI.redis.mode must be \"disabled\", \"internal\" or \"external\" (got %q)" .Values.borgUI.redis.mode) }}
{{- end }}
{{- if and (eq .Values.borgUI.redis.mode "external") (not .Values.borgUI.redis.external.url) (not .Values.borgUI.redis.external.host) }}
{{- fail "borgUI.redis.mode=external requires borgUI.redis.external.url or borgUI.redis.external.host" }}
{{- end }}
