{{- if not (has .Values.node.backupMode (list "interval" "agent")) }}
{{- fail (printf "node.backupMode must be \"interval\" or \"agent\" (got %q)" .Values.node.backupMode) }}
{{- end }}
{{- if not (has .Values.cluster.backupMode (list "cronjob" "plan")) }}
{{- fail (printf "cluster.backupMode must be \"cronjob\" or \"plan\" (got %q)" .Values.cluster.backupMode) }}
{{- end }}
{{- if .Values.app }}
{{- fail "The `app` section has moved into `cluster` (chart 1.0.21): rename app.mode->cluster.mode, app.agentScripts->cluster.agentScripts, and drop app.enabled/app.nodeName/app.resources/app.* (the console pod now shares cluster.nodeName/resources/extraVolumes/etc. with the CronJob). See chart/README.md." }}
{{- end }}
{{- if .Values.config }}
{{- fail "The `config` section has moved into `node`/`cluster` (chart 1.0.21): config.clusterInclude->cluster.include, config.clusterExclude->cluster.exclude, config.s3Buckets->cluster.s3Buckets, config.nodeInclude->node.include, config.nodeExclude->node.exclude. See chart/README.md." }}
{{- end }}
{{- if not (has .Values.cluster.mode (list "legacy" "agent")) }}
{{- fail (printf "cluster.mode must be \"legacy\" or \"agent\" (got %q)" .Values.cluster.mode) }}
{{- end }}
{{- if and .Values.cluster.enabled (eq .Values.cluster.backupMode "plan") }}
{{- if ne .Values.cluster.mode "agent" }}
{{- fail "cluster.backupMode=plan registers a server-side BackupPlan via the console pod — it requires cluster.mode=agent (or use cluster.backupMode=cronjob)" }}
{{- end }}
{{- end }}
{{- if not (has .Values.borgUI.redis.mode (list "disabled" "internal" "external")) }}
{{- fail (printf "borgUI.redis.mode must be \"disabled\", \"internal\" or \"external\" (got %q)" .Values.borgUI.redis.mode) }}
{{- end }}
{{- if and (eq .Values.borgUI.redis.mode "external") (not .Values.borgUI.redis.external.url) (not .Values.borgUI.redis.external.host) }}
{{- fail "borgUI.redis.mode=external requires borgUI.redis.external.url or borgUI.redis.external.host" }}
{{- end }}
{{- /*
Borg 2.0.0b25 has no rest:// scheme and reads such a URL as a local directory.
A base that comes from an existing Secret is not visible here; the borg2 wrapper
refuses it at run time.
*/}}
{{- if and (eq (toString .Values.borg.version) "2") (not .Values.borg.repoBase.existingSecret) (hasPrefix "rest://" (lower (trim (toString .Values.borg.repoBase.value)))) }}
{{- fail "borg.repoBase.value: rest:// repository URLs were removed in Borg 2.0.0b25, which reads one as a local directory. Use ssh://[user@]host[:port]/path (relative to the login directory; ssh://host//path is absolute) and create the repository anew. See \"Upgrading to Borg 2.0.0b25\" in chart/README.md." }}
{{- end }}
{{- /*
borg.encryption names a mode the way borg-init reads BORG_ENCRYPTION
(docker/rootfs/usr/local/lib/borg-encryption.sh): Borg 1 passes Borg's own
names through, Borg 2 translates them and refuses none and authenticated-blake3.
The keyfile modes are refused here although borg-init has them: their key lives
in the pod's ~/.config/borg/keys, which no volume of the chart persists, and a
repository without its key cannot be read. tests/chart-encryption.bats keeps
these lists equal to what the script accepts. Any borg.version but 2 is Borg 1,
as for the scripts.
*/}}
{{- with .Values.borg.encryption }}
{{- $major := ternary "2" "1" (eq (toString $.Values.borg.version) "2") }}
{{- $valid := get (dict
      "1" (list "repokey-blake2" "repokey" "authenticated-blake2" "authenticated" "none")
      "2" (list "repokey-aes-ocb" "repokey-chacha20-poly1305" "authenticated" "authenticated-sha256")) $major }}
{{- $keyfile := get (dict
      "1" (list "keyfile-blake2" "keyfile")
      "2" (list "keyfile-aes-ocb" "keyfile-chacha20-poly1305")) $major }}
{{- $mode := toString . }}
{{- if has $mode $keyfile }}
{{- fail (printf "borg.encryption: %q keeps the key in the pod (~/.config/borg/keys), and no volume of the chart keeps it: the key would go with the pod, and a repository without its key cannot be read. The chart does not offer the keyfile modes; valid: %s. Empty selects the default, %s." $mode (join ", " $valid) (first $valid)) }}
{{- else if not (has $mode $valid) }}
{{- fail (printf "borg.encryption: %q is not a Borg %s mode; valid: %s. Empty selects the default, %s." $mode $major (join ", " $valid) (first $valid)) }}
{{- end }}
{{- end }}
{{- include "k8s-borg.repoServer.validate" . }}
