{{- if .Values.cluster.enabled }}
{{- $clusterScripts := (include "k8s-borg.cluster.agentScripts" .) | fromYaml }}
apiVersion: {{ include "common.capabilities.statefulset.apiVersion" . }}
kind: StatefulSet
metadata:
  name: {{ printf "%s-app" (include "common.names.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "app") | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  serviceName: {{ printf "%s-app" (include "common.names.fullname" .) }}
  selector:
    matchLabels: {{- include "k8s-borg.matchLabels" (dict "context" $ "component" "app") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "app") | nindent 8 }}
    spec:
      {{- if and (eq .Values.cluster.mode "agent") (include "k8s-borg.ui.reconcileGate" .) }}
      serviceAccountName: {{ include "k8s-borg.agentSAName" . }}
      {{- end }}
      {{- include "k8s-borg.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.cluster.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.cluster.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.cluster.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.cluster.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.cluster.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.cluster.tolerations "context" $) | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "k8s-borg.volumes.common" . | nindent 8 }}
        {{- include "k8s-borg.volumes.db" . | nindent 8 }}
        {{- if and (eq .Values.cluster.mode "agent") $clusterScripts }}
        - name: agent-scripts
          configMap:
            name: {{ include "k8s-borg.clusterAgentScriptsConfigMapName" . }}
            # 0555: readable + executable for the agent's allow-list.
            defaultMode: 365
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
        {{- if .Values.cluster.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.cluster.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
      initContainers:
        {{- include "k8s-borg.sshInitContainer" . | nindent 8 }}
        {{- if eq .Values.cluster.mode "agent" }}
        {{- if include "k8s-borg.ui.reconcileGate" . }}
        {{- include "k8s-borg.waitForReconcileInitContainer" . | nindent 8 }}
        {{- else }}
        {{- include "k8s-borg.waitForBorgUIInitContainer" . | nindent 8 }}
        {{- end }}
        {{- end }}
      containers:
        - name: app
          image: {{ include "k8s-borg.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          # Long-lived console pod: inspection mode (tails the log) unless enrolled
          # as a managed agent (BORG_UI_AGENT=true → runs the agent). kubectl exec in
          # to interact with the repositories, DB dumps and mounted sources.
          command: ["/bin/sh", "-c"]
          args:
            - hostname "${NODE_NAME}" 2>/dev/null || printf '%s' "${NODE_NAME}" > /proc/sys/kernel/hostname; exec /run.sh
          securityContext: {{- toYaml .Values.cluster.containerSecurityContext | nindent 12 }}
          env:
            - name: NODE_NAME
              value: {{ .Values.cluster.nodeName | quote }}
            {{- include "k8s-borg.env.common" . | nindent 12 }}
            {{- if eq .Values.cluster.mode "agent" }}
            {{- include "k8s-borg.env.agent" . | nindent 12 }}
            # Register a BackupPlan only when the cluster backup is plan-driven;
            # in cronjob mode the agent just makes the repo visible in Borg UI.
            - name: BORG_REGISTER_PLAN
              value: {{ and .Values.cluster.enabled (eq .Values.cluster.backupMode "plan") | ternary "true" "false" | quote }}
            {{- if $clusterScripts }}
            - name: BORG_UI_AGENT_SCRIPTS_DIR
              value: /etc/borg-ui-agent-scripts
            {{- end }}
            {{- end }}
          volumeMounts:
            {{- include "k8s-borg.volumeMounts.common" . | nindent 12 }}
            {{- include "k8s-borg.volumeMounts.db" . | nindent 12 }}
            {{- if and (eq .Values.cluster.mode "agent") $clusterScripts }}
            - name: agent-scripts
              mountPath: /etc/borg-ui-agent-scripts
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
            {{- if .Values.cluster.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.cluster.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
          {{- if .Values.cluster.resources }}
          resources: {{- toYaml .Values.cluster.resources | nindent 12 }}
          {{- end }}
{{- end }}
