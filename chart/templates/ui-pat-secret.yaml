{{- /*
Copyright IO ANALYTICA. All Rights Reserved.
SPDX-License-Identifier: Apache-2.0

Holds the admin PAT the reconcile Job mints and reuses. Kept across upgrades:
`helm.sh/resource-policy: keep` plus a `lookup` that re-emits the current value
so a re-templating on upgrade does NOT wipe the minted PAT. Empty on first
install; the reconcile Job PATCHes it (needs the RBAC in ui-reconcile-rbac.yaml).
*/}}
{{- if and .Values.borgUI.enabled .Values.borgUI.reconcile.enabled }}
{{- $name := include "k8s-borg.ui.patSecretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $pat := "" -}}
{{- if $existing -}}{{- $pat = (index $existing.data "BORG_UI_ADMIN_PAT" | default "") -}}{{- end -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
data:
  # base64 value (already encoded when read back via lookup); empty on first install
  BORG_UI_ADMIN_PAT: {{ $pat | quote }}
{{- end }}
