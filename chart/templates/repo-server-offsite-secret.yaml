{{- /*
Copyright IO ANALYTICA.
SPDX-License-Identifier: AGPL-3.0-only

The external copy's files given as values: rclone config, SSH key, known_hosts.
Only those not taken from an existing Secret. Only the copy job mounts it.
*/}}
{{- $o := .Values.repoServer.offsite -}}
{{- if and .Values.repoServer.enabled $o.enabled (include "k8s-borg.repoServer.offsite.secretManaged" .) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "k8s-borg.repoServer.offsite.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "repo-server-offsite") | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
stringData:
  {{- range (include "k8s-borg.repoServer.offsite.files" . | fromJsonArray) }}
  {{- $ref := get $o .name }}
  {{- if and $ref.value (not $ref.existingSecret) }}
  {{ .file }}: {{ $ref.value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
