{{- if .Values.node.enabled }}
{{- $nodeScripts := (include "k8s-borg.node.agentScripts" .) | fromYaml }}
{{- $snapshot := .Values.node.datastoreSnapshot }}
{{- $sqlite := .Values.node.sqlite }}
{{- /* The node steps before the backup, in order, and their removal after it. */}}
{{- $preScripts := list }}
{{- $postScripts := list }}
{{- if $sqlite.enabled }}
{{- $preScripts = append $preScripts "sqlite-copy" }}
{{- $postScripts = prepend $postScripts "sqlite-copy-clean" }}
{{- end }}
{{- if $snapshot.enabled }}
{{- $preScripts = append $preScripts "datastore-snapshot" }}
{{- $postScripts = prepend $postScripts "datastore-snapshot-clean" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ printf "%s-node" (include "common.names.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "node") | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels: {{- include "k8s-borg.matchLabels" (dict "context" $ "component" "node") | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "node") | nindent 8 }}
    spec:
      {{- if $sqlite.enabled }}
      serviceAccountName: {{ include "k8s-borg.nodeSAName" . }}
      {{- else if and (eq .Values.node.backupMode "agent") (include "k8s-borg.ui.reconcileGate" .) }}
      serviceAccountName: {{ include "k8s-borg.agentSAName" . }}
      {{- end }}
      {{- include "k8s-borg.imagePullSecrets" . | nindent 6 }}
      {{- if and $snapshot.enabled $snapshot.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.node.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.node.tolerations "context" $) | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "k8s-borg.volumes.common" . | nindent 8 }}
        - name: rootfs
          hostPath:
            path: {{ .Values.node.hostRootPath | quote }}
            type: Directory
        {{- if and (eq .Values.node.backupMode "agent") $nodeScripts }}
        - name: agent-scripts
          configMap:
            name: {{ include "k8s-borg.nodeAgentScriptsConfigMapName" . }}
            # 0555: readable + executable for the agent's allow-list.
            defaultMode: 365
        {{- end }}
        {{- if $snapshot.enabled }}
        # The datastore snapshot holds every Secret of the cluster in clear
        # text: memory only, never the node's disk.
        - name: datastore-snapshot
          emptyDir:
            medium: Memory
            {{- with $snapshot.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
        {{- end }}
        {{- if $sqlite.enabled }}
        # The SQLite copies, on the node's disk: they are as large as the
        # databases, and removed after each run.
        - name: sqlite-copies
          emptyDir:
            {{- with $sqlite.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- else }}
            {}
            {{- end }}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
      initContainers:
        {{- include "k8s-borg.sshInitContainer" . | nindent 8 }}
        {{- if eq .Values.node.backupMode "agent" }}
        {{- if include "k8s-borg.ui.reconcileGate" . }}
        {{- include "k8s-borg.waitForReconcileInitContainer" . | nindent 8 }}
        {{- else }}
        {{- include "k8s-borg.waitForBorgUIInitContainer" . | nindent 8 }}
        {{- end }}
        {{- end }}
      containers:
        - name: node
          image: {{ include "k8s-borg.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              hostname "k8s-borg-${NODE_NAME}" 2>/dev/null || printf '%s' "${NODE_NAME}" > /proc/sys/kernel/hostname
              while true; do
                /run.sh run
                sleep {{ .Values.node.backupIntervalSeconds }}
              done
          securityContext: {{- toYaml .Values.node.containerSecurityContext | nindent 12 }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: BORG_MODE
              value: node
            {{- include "k8s-borg.env.common" . | nindent 12 }}
            {{- if eq .Values.node.backupMode "agent" }}
            {{- include "k8s-borg.env.agent" . | nindent 12 }}
            - name: BORG_REGISTER_PLAN
              value: "true"
            {{- if $nodeScripts }}
            - name: BORG_UI_AGENT_SCRIPTS_DIR
              value: /etc/borg-ui-agent-scripts
            {{- end }}
            {{- /* The SQLite copies and the snapshot are the last hooks
                   before the backup and their removal the first after it,
                   whatever the result. A failed step does not stop the file
                   backup; Borg UI shows it as a warning. The owned names let
                   register-backup-plan keep the plan's other hooks and drop
                   these once switched off. */}}
            - name: BORG_PLAN_OWNED_AGENT_SCRIPTS
              value: "datastore-snapshot datastore-snapshot-clean sqlite-copy sqlite-copy-clean"
            {{- if $preScripts }}
            - name: BORG_PLAN_PRE_AGENT_SCRIPTS
              value: {{ join " " $preScripts | quote }}
            - name: BORG_PLAN_PRE_AGENT_SCRIPTS_CONTINUE
              value: {{ join " " $preScripts | quote }}
            - name: BORG_PLAN_POST_AGENT_SCRIPTS
              value: {{ join " " $postScripts | quote }}
            {{- end }}
            {{- end }}
            {{- if $snapshot.enabled }}
            - name: DATASTORE_SNAPSHOT
              value: "true"
            - name: DATASTORE_SNAPSHOT_DIR
              value: {{ include "k8s-borg.datastoreSnapshotDir" . | quote }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DATASTORE_ETCD_ENDPOINT
              {{- if $snapshot.etcdEndpoint }}
              value: {{ $snapshot.etcdEndpoint | quote }}
              {{- else if $snapshot.hostNetwork }}
              value: "https://127.0.0.1:2379"
              {{- else }}
              value: "https://$(HOST_IP):2379"
              {{- end }}
            - name: K3S_DATA_DIR
              value: {{ $snapshot.k3sDataDir | quote }}
            - name: KUBEADM_DIR
              value: {{ $snapshot.kubeadmDir | quote }}
            {{- end }}
            {{- if $sqlite.enabled }}
            - name: SQLITE_COPY
              value: "true"
            - name: SQLITE_COPY_DIR
              value: {{ include "k8s-borg.sqliteCopyDir" . | quote }}
            - name: SQLITE_BUSY_TIMEOUT
              value: {{ $sqlite.busyTimeout | quote }}
            - name: KUBELET_DIR
              value: {{ $sqlite.kubeletDir | quote }}
            {{- end }}
          volumeMounts:
            {{- include "k8s-borg.volumeMounts.common" . | nindent 12 }}
            - name: rootfs
              mountPath: /node
              readOnly: {{ .Values.node.hostRootReadOnly }}
              {{- if $sqlite.enabled }}
              # Volumes the kubelet mounts after the pod started (CSI) show
              # up below /node only with HostToContainer.
              mountPropagation: HostToContainer
              {{- end }}
            {{- if and (eq .Values.node.backupMode "agent") $nodeScripts }}
            - name: agent-scripts
              mountPath: /etc/borg-ui-agent-scripts
              readOnly: true
            {{- end }}
            {{- if $snapshot.enabled }}
            - name: datastore-snapshot
              mountPath: {{ include "k8s-borg.datastoreSnapshotDir" . }}
            {{- end }}
            {{- if $sqlite.enabled }}
            - name: sqlite-copies
              mountPath: {{ include "k8s-borg.sqliteCopyDir" . }}
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
          {{- if .Values.node.resources }}
          resources: {{- toYaml .Values.node.resources | nindent 12 }}
          {{- end }}
{{- end }}
