{{- if .Values.borgUI.enabled }}
apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ printf "%s-ui" (include "common.names.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "ui") | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # /data holds the server's own state on RWX storage — never two writers at once.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "k8s-borg.matchLabels" (dict "context" $ "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "ui") | nindent 8 }}
    spec:
      {{- include "k8s-borg.imagePullSecrets" . | nindent 6 }}
      volumes:
        - name: ui
          persistentVolumeClaim:
            claimName: {{ include "k8s-borg.pvc.ui" . }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "k8s-borg.pvc.cache" . }}
        {{- if include "k8s-borg.ui.systemKeyActive" . }}
        - name: ssh-secret
          secret:
            secretName: {{ include "k8s-borg.sshSecretName" . }}
            defaultMode: 384
        - name: ssh-staged
          emptyDir:
            medium: Memory
        {{- end }}
      {{- if include "k8s-borg.ui.systemKeyActive" . }}
      initContainers:
        {{- include "k8s-borg.uiSshInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "k8s-borg.ui.image" . | quote }}
          imagePullPolicy: {{ .Values.borgUI.image.pullPolicy | quote }}
          {{- with include "k8s-borg.ui.securityContext" . }}
          securityContext: {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8081
          env:
            {{- $env := include "k8s-borg.ui.env" . }}
            {{- $env | nindent 12 }}
            {{- with include "k8s-borg.ui.extraEnv" (dict "context" . "env" $env) }}
            {{- . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: ui
              mountPath: /data
            - name: cache
              mountPath: /home/borg/.cache
              subPath: k8s-borg-ui
            {{- if include "k8s-borg.ui.systemKeyActive" . }}
            - name: ssh-staged
              mountPath: {{ include "k8s-borg.ui.sshKeyDir" . }}
              readOnly: true
            {{- end }}
          # The entrypoint brings the database up to date before it starts
          # serving, so nothing listens for as long as that takes. Without a
          # startup probe the liveness probe applies from the first second and
          # kills the container mid-migration -- which then restarts it from the
          # beginning, forever. While this probe runs, liveness and readiness are
          # suspended.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.borgUI.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.borgUI.startupProbe.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          {{- with include "k8s-borg.ui.resources" . }}
          resources: {{- . | nindent 12 }}
          {{- end }}
{{- end }}
