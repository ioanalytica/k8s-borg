SPDX-License-Identifier: Apache-2.0

The resolver ServiceAccount is shared by the cluster CronJob and app
StatefulSet. Credentials remain namespace-scoped: one Role and RoleBinding is
rendered per referenced namespace, with get permission only for the named
Secrets in that namespace. Node DaemonSet pods never receive DB credentials.
*/}}
{{- if (include "k8s-borg.dbResolverEnabled" .) }}
{{- include "k8s-borg.validateDatabases" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-borg.dbResolverSAName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "db-resolver") | nindent 4 }}
---
{{- $secretsByNamespace := dict }}
{{- range $engine := list "mariadb" "postgres" }}
{{- $database := index $.Values.databases $engine }}
{{- if $database.enabled }}
{{- range $database.instances }}
{{- if .secretRef }}
{{- $namespace := .secretRef.namespace }}
{{- $names := get $secretsByNamespace $namespace | default list }}
{{- $_ := set $secretsByNamespace $namespace (append $names .secretRef.name | uniq) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $namespace, $secretNames := $secretsByNamespace }}
{{- $rbacName := printf "%s-db-%s" (include "common.names.fullname" $) (sha256sum $namespace | trunc 10) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $rbacName }}
  namespace: {{ $namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "db-resolver") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- range $secretNames }}
      - {{ . | quote }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $rbacName }}
  namespace: {{ $namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "db-resolver") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $rbacName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-borg.dbResolverSAName" $ }}
    namespace: {{ $.Release.Namespace | quote }}
---
{{- end }}
{{- end }}
