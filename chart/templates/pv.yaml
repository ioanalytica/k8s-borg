Copyright IO ANALYTICA.
SPDX-License-Identifier: AGPL-3.0-only

Optional static NFS PersistentVolumes. Cluster-infra-specific — only rendered
for persistence.<vol>.createPV=true. Otherwise bind your own PVs/StorageClass.
Each one goes with the claim of pvc.yaml: Borg UI's only with Borg UI.
*/}}
{{- range $key, $p := .Values.persistence }}
{{- if and $p.createPV (not $p.existingClaim) (or (ne $key "ui") $.Values.borgUI.enabled) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ printf "%s-%s-pv" (include "common.names.fullname" $) ($key | kebabcase) }}
  labels: {{- include "common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
  {{- if $p.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  capacity:
    storage: {{ $p.size | quote }}
  {{- /* --reuse-values keeps the values of the chart the release was
         installed with, which may have no accessModes yet. */}}
  accessModes: {{- toYaml ($p.accessModes | default (list "ReadWriteMany")) | nindent 4 }}
  persistentVolumeReclaimPolicy: {{ ternary "Retain" "Delete" $p.retain }}
  storageClassName: ""
  nfs:
    server: {{ $p.server | quote }}
    path: {{ $p.path | quote }}
{{- end }}
{{- end }}
