{{- range $key, $p := .Values.persistence }}
{{- if not $p.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" $) ($key | kebabcase) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
  {{- if $p.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  {{- /* --reuse-values keeps the values of the chart the release was
         installed with, which may have no accessModes yet. */}}
  accessModes: {{- toYaml ($p.accessModes | default (list "ReadWriteMany")) | nindent 4 }}
  {{- if $p.createPV }}
  storageClassName: ""
  volumeName: {{ printf "%s-%s-pv" (include "common.names.fullname" $) ($key | kebabcase) }}
  {{- else if $p.storageClassName }}
  storageClassName: {{ $p.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size | quote }}
{{- end }}
{{- end }}
