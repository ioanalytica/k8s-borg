{{- /*
Copyright IO ANALYTICA.
SPDX-License-Identifier: AGPL-3.0-only

Reconcile-status ConfigMap. The reconcile Job PATCHes data.reconciled=<revision>
on success; agent workloads gate their startup on it (wait-for-reconcile init
container). The template declares no `data` so Helm never clobbers the marker the
Job writes out-of-band.
*/}}
{{- if include "k8s-borg.ui.reconcileGate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-borg.ui.reconcileStatusCMName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "reconcile") | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
