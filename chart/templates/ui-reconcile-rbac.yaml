{{- /*
Copyright IO ANALYTICA.
SPDX-License-Identifier: AGPL-3.0-only

ServiceAccount + minimal Role for the reconcile Job: it reads and PATCHes exactly
the PAT Secret (persist the minted admin PAT) and — when agents gate on it — the
reconcile-status ConfigMap (publish the success marker). Scoped to those single
resourceNames — no broad access.
*/}}
{{- if and .Values.borgUI.enabled .Values.borgUI.reconcile.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-borg.reconcileSAName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "reconcile") | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-borg.reconcileSAName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "reconcile") | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "k8s-borg.ui.patSecretName" . }}"]
    verbs: ["get", "patch"]
  {{- if include "k8s-borg.ui.reconcileGate" . }}
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "k8s-borg.ui.reconcileStatusCMName" . }}"]
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-borg.reconcileSAName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "k8s-borg.labels" (dict "context" $ "component" "reconcile") | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-borg.reconcileSAName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-borg.reconcileSAName" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
