## @section Global parameters
##
global:
  ## @param global.imageRegistry Global Docker image registry (overrides image.registry)
  imageRegistry: ""
  ## @param global.imagePullSecrets Global Docker registry secret names as an array
  imagePullSecrets: []
  ## @param global.defaultStorageClass Global default StorageClass for PVC(s)
  defaultStorageClass: ""

## @section Common parameters
##
## @param nameOverride Partially override the fullname
nameOverride: ""
## @param fullnameOverride Fully override the fullname
fullnameOverride: ""
## @param commonLabels Labels added to all deployed resources
commonLabels: {}
## @param commonAnnotations Annotations added to all deployed resources
commonAnnotations: {}
## @param timezone Timezone for all pods (also the CronJob default). Safe default: UTC.
timezone: "UTC"

## @param extraVolumes Extra volumes added to ALL backup workloads. Mount your own
##   sources to back up here — e.g. an NFS share or a PVC at /mnt/nfs. The chart
##   does not assume any shared source of its own.
extraVolumes: []
#  - name: nfs
#    persistentVolumeClaim:
#      claimName: my-shared-nfs
## @param extraVolumeMounts Extra volume mounts added to ALL backup workloads
extraVolumeMounts: []
#  - name: nfs
#    mountPath: /mnt/nfs

## @param mountPoints Extra directories the init container pre-creates so the pod
##   can mount there at runtime (e.g. s3fs targets). MUST live under /mnt (a shared
##   writable emptyDir). The S3 mount path (s3.mountPath) is created automatically.
mountPoints: []
#  - /mnt/objectstore

## @section Image parameters
##
image:
  ## @param image.registry Agent image registry
  registry: ghcr.io
  ## @param image.repository Agent image repository
  repository: ioanalytica/k8s-borg
  ## @param image.tag Agent image tag (defaults to the chart appVersion)
  tag: ""
  ## @param image.pullPolicy Agent image pull policy
  pullPolicy: IfNotPresent

## @param initImage Image used by the SSH init container
initImage:
  repository: busybox
  tag: "1.37"
  pullPolicy: IfNotPresent

## @section Borg parameters
##
borg:
  ## @param borg.version Borg binary the scripts use: 1 or 2 (transport comes from the URL scheme)
  version: 1
  ## @param borg.encryption Mode of the repositories the pods create (rendered as BORG_ENCRYPTION, read
  ## by borg-init and register-repo). Empty = the default of borg.version: repokey-blake2 (Borg 1),
  ## repokey-aes-ocb (Borg 2). Named as Borg UI names the modes:
  ##   Borg 1   repokey-blake2, repokey, authenticated-blake2, authenticated, none
  ##   Borg 2   repokey-aes-ocb, repokey-chacha20-poly1305, authenticated (= authenticated-sha256)
  ## A mode the major does not have fails the render. So do the keyfile modes: their key would
  ## live in the pod, and no volume of the chart keeps it. A repository that exists keeps its mode.
  encryption: ""
  ## @param borg.treatWarningsAsErrors Propagate borg warnings (rc=1) as failures. Default false: the
  ## borg wrapper downgrades rc=1 (missing path, file changed mid-backup) to success so managed-agent
  ## backup jobs aren't marked "failed" on routine warnings.
  treatWarningsAsErrors: false
  ## @param borg.defaultParams Extra params injected into every borg call by the borg/borg2 wrapper.
  ## Mapped to BORG1_DEFAULT_PARAMS or BORG2_DEFAULT_PARAMS depending on borg.version above. Empty = none.
  defaultParams: ""
  ## @param borg.planCustomFlags Extra `borg create` flags stored on every registered backup plan
  ## (register-backup-plan writes them as the plan's custom_flags). Create-only — unlike defaultParams
  ## these would be invalid on other subcommands. e.g. "--filter AME --list --exclude-caches".
  ## NB: the agent's create already passes --stats; --list logs one line per file into the job log.
  planCustomFlags: ""
  ## @param borg.remotePath Name or path of the borg executable on an ssh:// server, e.g. "borg-1.4"
  ## or "borg2" when the server's borg isn't the default `borg` on PATH. Empty = none.
  ## Rendered as BORG_REMOTE_PATH. Borg 1: the borg wrapper turns it into the option
  ## `--remote-path=<value>` of every call. Borg 2 has no such option (removed in 2.0.0b22) and
  ## reads the variable itself.
  remotePath: ""
  ## Repository base. Each pod appends its node name. The same text means different directories
  ## for the two majors:
  ##
  ##   Borg 1   ssh://user@host:22/./cluster    relative to the login directory
  ##            ssh://user@host:22/srv/cluster  absolute
  ##   Borg 2   ssh://user@host:22/cluster      relative to the login directory
  ##            ssh://user@host:22//srv/cluster absolute
  ##            sftp://…, s3:…, rclone:…        see the Borg 2 documentation
  ##
  ## Borg 2.0.0b25 and later know no rest:// (up to 2.0.0b24 the name of what is ssh:// now) and
  ## read such a URL as a local directory: `value` is refused at render time for borg.version 2,
  ## a base from an existing Secret by the borg2 wrapper at run time. The wrapper goes by the
  ## Borg 2 of the image, the chart cannot: a release that pins an image with an earlier Borg 2
  ## takes its rest:// base from an existing Secret.
  ## Borg 2 takes the port from the URL unless a remote shell command is set (BORG_RSH or
  ## BORGSTORE_RSH, which the chart does not set). Such a command is used as it is and has to
  ## name the port itself: "ssh -p 2222".
  ## Sensitive: provide `value`, or reference an existing Secret via existingSecret[+existingSecretKey].
  repoBase:
    ## @param borg.repoBase.value Repository base URL
    value: ""
    ## @param borg.repoBase.existingSecret Existing Secret holding the repository base
    existingSecret: ""
    ## @param borg.repoBase.existingSecretKey Key in existingSecret (default: BORG_REPO_BASE)
    existingSecretKey: ""
  ## Repository passphrase (sensitive). Mandatory for every Borg 2 repository: from 2.0.0b25 on
  ## Borg 2 has no repository without a key, and every command needs it, break-lock and
  ## repo-delete included.
  passphrase:
    ## @param borg.passphrase.value Repository passphrase
    value: ""
    ## @param borg.passphrase.existingSecret Existing Secret holding the passphrase
    existingSecret: ""
    ## @param borg.passphrase.existingSecretKey Key in existingSecret (default: BORG_PASSPHRASE)
    existingSecretKey: ""
  ## @param borg.archiveNameTemplate Managed-agent archive name template (register-backup-plan).
  ## Empty = the agent's built-in default `$(NODE_NAME)-{now:%Y-%m-%d-%s}` (with a REPO_NAME
  ## fallback). borg expands `{now:FMT}`/`{now}`; borg-ui expands `{date}/{time}/{timestamp}`.
  ## To include the node name, use the k8s env-ref form `$(NODE_NAME)` (NOT `${NODE_NAME}`) —
  ## e.g. "$(NODE_NAME)-{now:%s}" restores the old timestamp-only naming.
  archiveNameTemplate: ""
  ## @param borg.dbBackupLocation Where logical DB dumps are written before archiving
  dbBackupLocation: "/mnt/nfs/data/db-backup"
  ## @param borg.retention Prune retention (KEEP_DAILY/WEEKLY/MONTHLY)
  retention:
    daily: 7
    weekly: 4
    monthly: 3
  ## Post-backup maintenance run by each backup plan (register-backup-plan).
  ## Prune retention comes from borg.retention above. NB: `check` here is an EXTRA
  ## check after every backup — independent of borg.checkSchedule (scheduled checks).
  backupMaintenance:
    ## @param borg.backupMaintenance.prune Run borg prune after each backup
    prune: true
    ## @param borg.backupMaintenance.compact Run borg compact after each backup
    compact: true
    ## @param borg.backupMaintenance.check Run an extra borg check after each backup
    check: false
    ## @param borg.backupMaintenance.checkMaxDuration Time budget (seconds) for the post-backup check
    checkMaxDuration: 3600
    ## @param borg.backupMaintenance.checkExtraFlags Extra flags for the post-backup check (e.g. "--verify-data")
    checkExtraFlags: ""
  ## Scheduled repository integrity checks (borg check). Rendered into a ConfigMap
  ## and mounted at BORG_CHECK_SCHEDULE_DIR; at startup each agent pod applies its
  ## own schedule via `set-check-schedule`, selecting the key that matches its
  ## POD HOSTNAME (`<hostname>_check_schedule`) and falling back to `default`.
  ## Only used by components running as managed agents (node.backupMode=agent or
  ## cluster.backupMode=plan). Leave both empty to create no schedules.
  ## Pod hostnames: DaemonSet nodes are "k8s-borg-<node>", the console/agent pod is
  ## its cluster.nodeName.
  checkSchedule:
    ## @param borg.checkSchedule.default Fallback cron for pods without a perHost entry (empty = no default)
    default: ""
    ## @param borg.checkSchedule.perHost Per-pod-hostname cron map, e.g. { k8s-borg-node01: "0 3 * * *", console: "0 4 * * 0" }
    perHost: {}
  ## Scheduled backups (borg create via a server-side backup plan). Same shape and
  ## POD-HOSTNAME keying as checkSchedule; each agent pod applies its own cron via
  ## `register-backup-plan`, mounted at BORG_BACKUP_SCHEDULE_DIR. Sources/excludes
  ## come from config.* (the /root/.borg pattern files), not from here. Leave both
  ## empty to create plans without a schedule (they can still be run manually).
  backupSchedule:
    ## @param borg.backupSchedule.default Fallback backup cron for pods without a perHost entry (empty = no default)
    default: ""
    ## @param borg.backupSchedule.perHost Per-pod-hostname backup cron map, e.g. { k8s-borg-node01: "0 2 * * *", console: "0 2 * * 0" }
    perHost: {}

## @section S3 sources (cluster/app jobs)
## Buckets (cluster.s3Buckets) are mounted via s3fs under s3.mountPath. The init
## container pre-creates that directory in the shared /mnt volume.
##
s3:
  ## @param s3.enabled Mount S3 buckets as read sources (via s3fs)
  enabled: false
  ## @param s3.endpoint S3 endpoint URL
  endpoint: "http://minio.minio.svc:9000"
  ## @param s3.region SigV4 region of the S3 endpoint (s3fs `endpoint=`); empty keeps s3fs's default us-east-1. Servers that check the region (e.g. Garage) need it set
  region: ""
  ## @param s3.mountPath Where buckets are mounted (must be under /mnt)
  mountPath: "/mnt/s3"
  ## @param s3.verifyListing Before each cluster backup, compare every mount with its bucket's listing through the S3 API; a bucket that misses objects or lost its mount is mounted again, and if it still misses objects the run fails (it is archived anyway)
  verifyListing: true
  ## @param s3.onMountFailure What a bucket that cannot be mounted does: `skip` (warn, back up the other buckets; the start stops only when no bucket can be mounted) or `fail` (stop the start). A skipped bucket makes each cluster backup end with a warning
  onMountFailure: skip
  ## S3 access key (sensitive).
  accessKey:
    value: ""
    existingSecret: ""
    existingSecretKey: ""
  ## S3 secret key (sensitive).
  secretKey:
    value: ""
    existingSecret: ""
    existingSecretKey: ""

## @section SSH credentials (Secret, staged into /root/.ssh)
##
ssh:
  ## @param ssh.existingSecret Use an existing SSH Secret (keys: id_ed25519, id_ed25519.pub, known_hosts)
  existingSecret: ""
  ## @param ssh.privateKey SSH private key for the Borg host
  privateKey: ""
  ## @param ssh.publicKey SSH public key
  publicKey: ""
  ## @param ssh.knownHosts known_hosts for the Borg host
  knownHosts: ""
  ## The two entries below are for the repository server (repoServer.enabled) and
  ## live in the same Secret; an existing Secret has to carry both keys itself.
  ## @param ssh.hostKey Host key of the repository server, private part (Secret key
  ## `ssh_host_ed25519_key`). Create one with: ssh-keygen -t ed25519 -N "" -C "" -f ssh_host_ed25519_key
  hostKey: ""
  ## @param ssh.authorizedKeys Public keys of the repository server's clients (Secret key
  ## `authorized_keys`), one per line as in any authorized_keys file: "<type> <key> <name>".
  ## The comment names the client. No options — the server adds the restriction itself.
  authorizedKeys: ""

## @section Databases (logical dumps; cluster/app workloads)
##
databases:
  ## An instance is configured EITHER with a static `config` (rendered into a
  ## chart-managed Secret, or brought via existingSecret) OR with a `secretRef`
  ## pointing at a credentials Secret in the database's own namespace (e.g. the
  ## operator-generated Zalando/mariadb-operator secrets). secretRef instances
  ## are resolved at pod start by an init container: it reads each referenced
  ## Secret through the Kubernetes API and synthesizes the *.conf file the dump
  ## scripts consume. The generated files are available in the cluster CronJob
  ## for backups and in the app StatefulSet for restores; node DaemonSet pods
  ## never receive DB credentials. The StatefulSet must be rolled after a
  ## referenced Secret changes. The chart creates a
  ## get-only Role in each referenced namespace, restricted to exactly the
  ## configured Secret names, and binds it to a dedicated resolver ServiceAccount.
  mariadb:
    ## @param databases.mariadb.enabled Back up MariaDB instances
    enabled: false
    ## @param databases.mariadb.existingSecret Use an existing Secret (one *.conf per instance)
    existingSecret: ""
    ## @param databases.mariadb.instances MariaDB instances (static config or secretRef)
    instances: []
    #  - name: mariadb-example
    #    config: |
    #      [client]
    #      host = mariadb.databases.svc
    #      user = backup
    #      password = CHANGE_ME
    #  - name: mariadb-operator-example
    #    host: mariadb.databases.svc
    #    port: 3306              # default 3306
    #    user: root              # literal user; omit when usernameKey is set
    #    secretRef:
    #      namespace: databases
    #      name: mariadb
    #      passwordKey: root-password
    #      # usernameKey: username  # read the user from the Secret instead
  postgres:
    ## @param databases.postgres.enabled Back up PostgreSQL instances
    enabled: false
    ## @param databases.postgres.existingSecret Use an existing Secret (one *.conf per instance)
    existingSecret: ""
    ## @param databases.postgres.instances PostgreSQL instances (static config or secretRef)
    instances: []
    #  - name: postgres-example
    #    config: |
    #      postgres.databases.svc:5432:*:backup:CHANGE_ME
    #  - name: zalando-example
    #    host: example-db.databases.svc
    #    port: 5432              # default 5432
    #    secretRef:
    #      namespace: databases
    #      name: postgres.example-db.credentials.postgresql.acid.zalan.do
    #      usernameKey: username
    #      passwordKey: password
  ## @param databases.credentialsResolver Image for the secretRef resolver init container
  credentialsResolver:
    image:
      ## bitnamilegacy is a frozen mirror, its tags are static.
      repository: bitnamilegacy/kubectl
      tag: latest
      pullPolicy: IfNotPresent

## @section Node backup (DaemonSet)
##
node:
  ## @param node.enabled Deploy the node-backup DaemonSet
  enabled: true
  ## @param node.backupMode How node backups run: "interval" (legacy in-pod loop
  ##   every backupIntervalSeconds) or "agent" (enroll each DaemonSet pod as a
  ##   managed agent and register a per-node backup plan in Borg UI). "agent"
  ##   requires a reachable server (borgUI.agentConnection.server or an in-cluster
  ##   Borg UI). Node schedules then come from borg.backupSchedule/checkSchedule.
  backupMode: interval
  ## @param node.backupIntervalSeconds Sleep between node backups (backupMode=interval only)
  backupIntervalSeconds: 3600
  ## @param node.hostRootPath Host path mounted at /node
  hostRootPath: /
  ## @param node.hostRootReadOnly Mount the host root at /node read-only
  ## Backups only READ /node, so read-only is the safe default. Set to false to
  ## allow restore-to-original-location on the node (the agent restore writes back
  ## through /node). WARNING: false lets a restore write anywhere on the host FS —
  ## the pod is already privileged, but this additionally grants host-write.
  hostRootReadOnly: true
  ## @param node.tolerations Tolerations (backups run on every node by default)
  tolerations:
    - operator: Exists
      effect: NoSchedule
  ## @param node.containerSecurityContext Node container security context (privileged: reads node FS, FUSE)
  containerSecurityContext:
    privileged: true
    capabilities:
      add:
        - SYS_ADMIN
  ## @param node.resources Node container resources
  resources: {}
  ## @param node.agentScripts Pre/post-backup scripts published to each NODE agent (backupMode=agent).
  ##   Map of filename -> script body. Each entry is mounted read-only and executable at
  ##   /etc/borg-ui-agent-scripts and becomes selectable as a pre/post-backup hook in Borg UI.
  ##   The agent only ever runs scripts from this allow-list. Use this for node-local scripts;
  ##   for CLUSTER-backup scripts (which need the cluster secrets) use cluster.agentScripts instead.
  ##   Example:
  ##   agentScripts:
  ##     pre-db-dump.sh: |
  ##       #!/bin/sh
  ##       # borg-ui: Dump the local database before backup
  ##       pg_dumpall > /var/backups/db.sql
  agentScripts: {}
  ## Borg patterns for node backups (ConfigMap -> /root/.borg, node-*.patterns).
  ## Only the elementary "P fm" line is a default; add your own roots/excludes.
  ## @param node.include Borg include patterns for node backups (prepend the /node mount)
  include:
    - "P fm"
    # - "R /node/etc"
    # - "R /node/home"
    # - "R /node/root"
    # - "R /node/var/lib/rancher/rke2/server/db/snapshots"
  ## @param node.exclude Borg exclude patterns for node backups
  exclude: []
    # - "/node/storage"
    # - "/node/data"

## @section Cluster backup (CronJob or console/agent pod)
## The cluster covers the cluster-scope data (S3/NFS/DB sources) AND the long-lived
## console pod that represents the cluster repository in Borg UI and, in agent mode,
## runs the cluster backup. The CronJob and the console pod are pinned the same way
## (same node-local storage) and share the settings below.
##
cluster:
  ## @param cluster.enabled Back up cluster-scope data + deploy the console/agent pod
  enabled: true
  ## @param cluster.mode Console pod behaviour: "legacy" (inspection only — tails the
  ##   log, kubectl exec in) or "agent" (enrol at Borg UI: register the cluster
  ##   repository + check-schedule so it is browsable, and run the agent). Agent mode
  ##   needs a reachable Borg UI (borgUI.agentConnection.server or an in-cluster
  ##   borgUI.enabled server). cluster.backupMode=plan requires cluster.mode=agent.
  mode: legacy
  ## @param cluster.backupMode How the cluster backup is scheduled (not who talks to
  ##   Borg UI): "cronjob" → a k8s CronJob runs it on cluster.schedule (the console
  ##   pod, if agent, just makes the repo visible); "plan" → a server-side BackupPlan
  ##   run by the console/agent pod (needs cluster.mode=agent). Plan/check schedules
  ##   come from borg.backupSchedule/checkSchedule (keyed by cluster.nodeName).
  backupMode: cronjob
  ## @param cluster.schedule Cron schedule (backupMode=cronjob only)
  schedule: "0 */6 * * *"
  ## @param cluster.timeZone CronJob time zone (defaults to .timezone)
  timeZone: ""
  ## @param cluster.borgUiResync After each CronJob run (backupMode=cronjob), ask Borg UI
  ##   to resync the cluster repository so the new archives, the pruned ones and the
  ##   size show up right away instead of on Borg UI's next periodic reconcile run.
  ##   Only takes effect with a Borg UI to talk to (borgUI.enabled or
  ##   borgUI.agentConnection.server). Best effort: a failure is logged as a warning
  ##   and never changes the backup's exit code.
  borgUiResync: true
  ## @param cluster.nodeName Logical NODE_NAME for the cluster repo — used by BOTH the
  ##   CronJob and the console/agent pod (its Borg UI agent/repo/schedule key)
  nodeName: "k8s-borg-mycluster"
  ## @param cluster.concurrencyPolicy CronJob concurrency policy
  concurrencyPolicy: Forbid
  ## @param cluster.containerSecurityContext Cluster container security context
  containerSecurityContext:
    privileged: true
    capabilities:
      add:
        - SYS_ADMIN
  ## @param cluster.resources Cluster container resources
  resources: {}
  ## Scheduling — pin the cluster backup to the node that holds its backup-source
  ## storage. A node-local PVC (see cluster.extraVolumes) is only mountable on its
  ## own node, and that node is typically tainted, so nodeSelector/affinity select
  ## it and tolerations let the pod land there.
  ## @param cluster.nodeSelector Node selector for the cluster CronJob pod
  nodeSelector: {}
  ## @param cluster.affinity Affinity for the cluster CronJob pod
  affinity: {}
  ## @param cluster.tolerations Tolerations for the cluster CronJob pod
  tolerations: []
  ## Volumes scoped to the cluster CronJob ONLY (in addition to the global
  ## .extraVolumes). Use for the cluster backup source/cache, e.g. a node-local
  ## PVC that gives borg a stable mount so file attributes survive between runs
  ## (a re-mounted NFS changes them and forces a full, hours-long re-backup).
  ## @param cluster.extraVolumes Extra volumes for the cluster CronJob + console pod
  extraVolumes: []
  ## @param cluster.extraVolumeMounts Extra volume mounts for the cluster CronJob + console pod
  extraVolumeMounts: []
  ## @param cluster.agentScripts Pre/post-backup scripts published to the CLUSTER agent (cluster.mode=agent).
  ##   Map of filename -> script body, mounted read-only + executable at
  ##   /etc/borg-ui-agent-scripts on the console/agent pod and selectable as a pre/post-backup
  ##   hook in Borg UI. Put cluster-backup scripts HERE (not under node.agentScripts): this pod
  ##   is where the cluster DB/source secrets live; node pods do not have them.
  ##   A wrapper for each enabled database is added automatically and DEEP-MERGED with the
  ##   entries below (yours win on a name collision): databases.mariadb.enabled ->
  ##   `backup-cluster-mariadb`, databases.postgres.enabled -> `backup-cluster-postgres`
  ##   (each execs /usr/local/bin/backup-cluster-<engine>), and s3.enabled -> `s3-check-mounts`
  ##   (`s3-mount-buckets --check`: a warning in Borg UI when a listed bucket is not mounted).
  ##   In cluster.backupMode=plan these run as pre-backup hooks of the cluster plan.
  ##   Only add entries here for extra scripts or to override a default. Example:
  ##   agentScripts:
  ##     backup-cluster-postgres: |
  ##       #!/bin/sh
  ##       # borg-ui: Dump the cluster Postgres before backup
  ##       pg_dumpall > /mnt/cluster/db.sql
  agentScripts: {}
  ## Borg patterns + S3 buckets for cluster backups (ConfigMap -> /root/.borg,
  ## cluster-*.patterns / cluster-s3-buckets). Only "P fm" is a default.
  ## @param cluster.include Borg include patterns for cluster backups
  include:
    - "P fm"
    # - "R /mnt/s3"
    # - "R /mnt/nfs/users"
    # - "R /mnt/nfs/data/static"
    # - "R /mnt/nfs/data/db-backup"
  ## @param cluster.exclude Borg exclude patterns for cluster backups
  exclude: []
    # - "/mnt/nfs/data/static/some-recreatable-app"
  ## @param cluster.s3Buckets Buckets to mount and back up (one per line -> cluster-s3-buckets)
  s3Buckets: []
    # - "my-bucket-1"
    # - "my-bucket-2"

## @section Borg UI (optional; DEV/TEST)
##
borgUI:
  ## @param borgUI.enabled Deploy the Borg UI server (Deployment/Service/Ingress)
  enabled: false
  image:
    ## @param borgUI.image.registry Borg UI server image registry
    registry: ghcr.io
    ## @param borgUI.image.repository Borg UI server image repository
    repository: ioanalytica/k8s-borg-ui
    ## @param borgUI.image.tag Borg UI server image tag
    tag: "2.3.10-34-g49099c8c0"
    ## @param borgUI.image.pullPolicy Borg UI server image pull policy
    pullPolicy: IfNotPresent
  ## Startup budget for the database upgrade the entrypoint runs before serving.
  ## Nothing listens until it finishes, and on a large database over NFS that is
  ## minutes; liveness would otherwise kill it and restart the migration from the
  ## beginning on every attempt. Default = 30 minutes.
  startupProbe:
    ## @param borgUI.startupProbe.periodSeconds Seconds between startup checks
    periodSeconds: 10
    ## @param borgUI.startupProbe.failureThreshold Checks allowed before the container is considered failed
    failureThreshold: 180
  ## @param borgUI.publicBaseUrl Public base URL advertised by the server
  publicBaseUrl: "https://borgui.example.com"
  ## @param borgUI.adminUser Admin username (the Borg UI server hardcodes "admin"; kept for enrollment login)
  adminUser: "admin"
  ## Admin password. Drives the server's INITIAL_ADMIN_PASSWORD *and* agent enrollment
  ## login — they must match. Sensitive: value or existingSecret[+existingSecretKey].
  adminPassword:
    value: ""
    existingSecret: ""
    existingSecretKey: ""
  ## Postgres backend for the UI's own database. Off by default → the bundled
  ## SQLite file under /data. When enabled, the server assembles its connection
  ## from the parts below and, on first boot, upgrades the existing SQLite
  ## database into Postgres (the SQLite file is kept alongside as borg_bak.db).
  ## The Postgres server itself is not deployed here — this only points the UI at
  ## an existing one.
  postgres:
    ## @param borgUI.postgres.enabled Store the UI database in Postgres instead of the SQLite file
    enabled: false
    ## @param borgUI.postgres.host Postgres host (required when enabled)
    host: ""
    ## @param borgUI.postgres.port Postgres port
    port: 5432
    ## @param borgUI.postgres.database Postgres database name
    database: borg
    ## Credentials. Either inline (user/password, plaintext in values) OR a
    ## reference to an existing Secret with a username key and a password key —
    ## e.g. the one a Postgres operator generates. existingSecret takes
    ## precedence over the inline values.
    ## @param borgUI.postgres.user Inline username (leave empty when using existingSecret)
    user: ""
    ## @param borgUI.postgres.password Inline password (leave empty when using existingSecret)
    password: ""
    ## @param borgUI.postgres.existingSecret Name of an existing Secret holding the credentials
    existingSecret: ""
    ## @param borgUI.postgres.userKey Key in existingSecret holding the username
    userKey: username
    ## @param borgUI.postgres.passwordKey Key in existingSecret holding the password
    passwordKey: password
  ## License activation. The server contacts the activation service on startup and
  ## refreshes its entitlement periodically; the plan itself is then evaluated
  ## locally from the signed entitlement stored in the database.
  ##
  ## Air-gapped: set startupSync=false and activationServiceUrl="" (both are always
  ## rendered, so they override the image defaults). The instance then stays on the
  ## community plan until an admin imports a signed entitlement document via
  ## POST /api/system/licensing/import. Leaving sync on without egress costs every
  ## pod start the activation timeout and logs a refresh warning every hour.
  licensing:
    ## @param borgUI.licensing.startupSync Contact the activation service on startup and refresh it periodically
    startupSync: true
    ## @param borgUI.licensing.activationServiceUrl Activation service URL. Empty disables all outbound license calls.
    activationServiceUrl: "https://license.borgui.com"
    ## Ed25519 public key the signed entitlement is verified against. Empty SKIPS
    ## signature validation entirely, so leave this alone unless you run your own
    ## activation service. Empty here = keep the key baked into the image.
    ## @param borgUI.licensing.activationPublicKey Override the entitlement-signing public key
    activationPublicKey: ""
    ## Applying a license from the HelmRelease. The reconcile Job does it on every
    ## install/upgrade (it already holds the admin PAT), so the license travels with
    ## the release instead of being clicked into the UI once. Two independent ways in:
    ##
    ##   licenseKey  -> POST /system/licensing/activate. Needs egress to the
    ##                  activation service. Applied only while the instance is
    ##                  unlicensed, so upgrades never re-activate and never burn a seat.
    ##   entitlement -> POST /system/licensing/import of a signed offline document.
    ##                  No egress — this is the air-gapped path.
    ##
    ## The offline document is bound to the instance_id the server generates on its
    ## FIRST boot, so it is inherently a second step: install, read the instance_id
    ## (Settings > Licensing, or the reconcile Job log, which prints it), have the
    ## document issued, then set it here and upgrade.
    ##
    ## Set both and they cover each other: the document is used as long as it matches
    ## this instance, and once it doesn't — the database was wiped and the instance
    ## came back with a new id — the key takes over and gets a fresh entitlement
    ## issued. A stale document alone (no key) fails the reconcile rather than
    ## silently leaving the instance on the community plan.
    ##
    ## Neither is re-applied without cause: an instance that already holds a paid
    ## license is never re-activated, and a document is imported only when the
    ## instance is unlicensed or the document expires later than what it holds — a
    ## live instance renews its own entitlement, and re-asserting an older copy kept
    ## in the release would roll that back.
    licenseKey:
      value: ""
      existingSecret: ""
      existingSecretKey: ""
    entitlement:
      ## @param borgUI.licensing.entitlement.existingSecret Secret holding the signed offline entitlement document (JSON: payload/signature/key_id)
      existingSecret: ""
      ## @param borgUI.licensing.entitlement.existingSecretKey Key in that Secret
      existingSecretKey: "entitlement.json"
  service:
    ## @param borgUI.service.type Borg UI Service type
    type: ClusterIP
    ## @param borgUI.service.port Borg UI Service port
    port: 8081
  ingress:
    ## @param borgUI.ingress.enabled Expose the Borg UI via Ingress
    enabled: false
    ## @param borgUI.ingress.ingressClassName Ingress class
    ingressClassName: traefik
    ## @param borgUI.ingress.host Ingress host
    host: "borgui.example.com"
    ## @param borgUI.ingress.annotations Ingress annotations (restrict exposure to trusted networks!)
    annotations: {}
    tls:
      ## @param borgUI.ingress.tls.enabled Enable TLS
      enabled: true
      ## @param borgUI.ingress.tls.secretName TLS Secret name
      secretName: "borgui-tls"
  ## @param borgUI.resources Borg UI server resources
  resources: {}
  ## @param borgUI.containerSecurityContext Borg UI server container security context
  ## Server-side backups of SSH sources mount the remote FS via sshfs, which needs
  ## /dev/fuse — the same requirement the node/cluster backup pods already have.
  ## `privileged: true` passes the host's /dev/fuse through (simplest). A tighter
  ## alternative is capabilities.add: [SYS_ADMIN] plus a hostPath mount of /dev/fuse.
  ## Leave empty ({}) if you never back up SSH/remote sources server-side.
  containerSecurityContext:
    privileged: true
  ## Archive-listing cache backend for the Borg UI server.
  ##   disabled → the server keeps its in-memory cache (lost on every UI-pod roll).
  ##   internal → deploy a dedicated Redis pod (its OWN Deployment, NOT a sidecar —
  ##              survives UI-pod rolls and, if scaled, is shared across workers).
  ##   external → point the server at an existing Redis instance.
  ## The server auto-selects Redis over in-memory when REDIS_URL/REDIS_HOST is set.
  redis:
    ## @param borgUI.redis.mode Cache backend: disabled | internal | external
    mode: disabled
    ## Password shared by the server and (for internal) the Redis pod. Empty → no
    ## auth. Sensitive: value or existingSecret[+existingSecretKey] (key REDIS_PASSWORD).
    auth:
      value: ""
      existingSecret: ""
      existingSecretKey: ""
    ## @param borgUI.redis.cacheTtlMinutes Cached-listing TTL in minutes (matches the UI). Empty → server default (120). Reconciled into the DB by the reconcile Job.
    cacheTtlMinutes: ""
    ## Internal Redis pod (mode=internal).
    internal:
      image:
        registry: docker.io
        repository: redis
        tag: "7.4-alpine"
        pullPolicy: IfNotPresent
      ## @param borgUI.redis.internal.maxmemory Redis maxmemory cap (cache size)
      maxmemory: "256mb"
      ## @param borgUI.redis.internal.maxmemoryPolicy Eviction policy when full
      maxmemoryPolicy: "allkeys-lru"
      ## Persistence for the Redis pod. A cache survives a Redis-pod restart if
      ## enabled; otherwise it just re-fills. Off by default — the win here is
      ## surviving UI-pod rolls, which needs only a separate pod, not a PVC.
      persistence:
        enabled: false
        existingClaim: ""
        storageClassName: ""
        size: 1Gi
      ## @param borgUI.redis.internal.resources Redis pod resources
      resources: {}
      ## @param borgUI.redis.internal.nodeSelector Redis pod nodeSelector
      nodeSelector: {}
      ## @param borgUI.redis.internal.tolerations Redis pod tolerations
      tolerations: []
      ## @param borgUI.redis.internal.affinity Redis pod affinity
      affinity: {}
    ## External Redis (mode=external).
    external:
      ## @param borgUI.redis.external.url Full URL redis://[:password@]host:port/db — takes precedence if set
      url: ""
      ## @param borgUI.redis.external.host Host (used when url is empty; password from redis.auth)
      host: ""
      ## @param borgUI.redis.external.port Port
      port: 6379
      ## @param borgUI.redis.external.db Database number
      db: 0
  ## How managed agents reach the Borg UI server. Which components actually enrol
  ## as agents is decided per component: node.backupMode=agent and
  ## cluster.backupMode=plan. (The server itself is never an agent — hence the
  ## name.) Enrolment still uses the admin user/password above; PAT-based agent
  ## auth is a later phase.
  agentConnection:
    ## @param borgUI.agentConnection.server Borg UI server URL. Empty → derived from the in-cluster Service.
    server: ""
  ## Reconcile Job (Helm post-install/upgrade hook): waits for the server, mints
  ## (and reuses) an admin PAT into a retained Secret, and reconciles OIDC/SSO,
  ## the system SSH key, remote machines and notification channels to match this
  ## HelmRelease every run.
  ## Runs the k8s-borg agent image (ships reconcile-borgui).
  reconcile:
    ## @param borgUI.reconcile.enabled Run the reconcile Job (only meaningful with borgUI.enabled)
    enabled: true
    ## @param borgUI.reconcile.patName Name of the PAT minted for admin/agent auth
    patName: "k8s-borg-reconcile"
    ## @param borgUI.reconcile.waitSeconds How long to wait for the server /health
    waitSeconds: 300
  ## OIDC / SSO. Reconciled declaratively by the reconcile Job (all fields the Borg
  ## UI settings dialog exposes). Only applied when oidc.enabled and the reconcile
  ## Job runs. Empty string = leave the server default.
  oidc:
    ## @param borgUI.oidc.enabled Enable OIDC login on the server
    enabled: false
    ## @param borgUI.oidc.discoveryUrl OIDC provider discovery URL (.well-known/openid-configuration)
    discoveryUrl: ""
    ## @param borgUI.oidc.clientId OIDC client ID
    clientId: ""
    ## OIDC client secret (sensitive): value or existingSecret[+existingSecretKey].
    clientSecret:
      value: ""
      existingSecret: ""
      existingSecretKey: ""
    ## @param borgUI.oidc.providerName Display name of the provider (login button)
    providerName: ""
    ## @param borgUI.oidc.tokenAuthMethod Token endpoint auth: client_secret_post | client_secret_basic
    tokenAuthMethod: "client_secret_post"
    ## @param borgUI.oidc.scopes OAuth scopes to request
    scopes: "openid profile email"
    ## @param borgUI.oidc.redirectUriOverride Override the auto-derived redirect URI (empty = auto)
    redirectUriOverride: ""
    ## @param borgUI.oidc.endSessionEndpointOverride Override the provider logout endpoint (empty = auto)
    endSessionEndpointOverride: ""
    ## @param borgUI.oidc.claimUsername ID-token claim used for the username
    claimUsername: "preferred_username"
    ## @param borgUI.oidc.claimEmail ID-token claim used for the email
    claimEmail: "email"
    ## @param borgUI.oidc.claimFullName ID-token claim used for the full name
    claimFullName: "name"
    ## @param borgUI.oidc.groupClaim ID-token claim carrying the group list (e.g. Zitadel: urn:zitadel:iam:org:project:roles)
    groupClaim: ""
    ## @param borgUI.oidc.roleClaim ID-token claim carrying the role directly (empty = derive from groups)
    roleClaim: ""
    ## @param borgUI.oidc.adminGroups Comma-separated groups that receive the admin role
    adminGroups: ""
    ## @param borgUI.oidc.allRepositoriesRoleClaim Claim carrying the per-all-repositories role
    allRepositoriesRoleClaim: ""
    ## @param borgUI.oidc.newUserMode How to handle first-seen OIDC users: deny | viewer | pending | template
    newUserMode: "viewer"
    ## @param borgUI.oidc.newUserTemplateUsername Template user to copy permissions from (newUserMode=template)
    newUserTemplateUsername: ""
    ## @param borgUI.oidc.defaultRole Global role granted to new OIDC users
    defaultRole: "viewer"
    ## @param borgUI.oidc.defaultAllRepositoriesRole Per-all-repositories role granted to new OIDC users
    defaultAllRepositoriesRole: "viewer"
    ## @param borgUI.oidc.disableLocalAuth Disable local password login (OIDC-only). Guarded: kept ON until an OIDC admin can sign in.
    disableLocalAuth: false
  ## Import the pods' SSH key (ssh.existingSecret) as the Borg UI *system* SSH key,
  ## so the server reaches ssh:// repos and remote machines with the SAME identity
  ## the backup pods use (its public key is already on those targets). An init
  ## container stages the key for the server user (uid 1001) — a plain secret mount
  ## would have the wrong owner/mode. The reconcile Job then imports it once
  ## (POST /api/ssh-keys/import) and it lives encrypted in the Borg UI DB.
  ## Enabling remoteMachines below implies this import.
  systemSshKey:
    ## @param borgUI.systemSshKey.import Import ssh.existingSecret as the Borg UI system SSH key
    import: false
    ## @param borgUI.systemSshKey.name Name for the imported system key
    name: "k8s-borg-system"
  ## @param borgUI.remoteMachines Remote machines (SSH connections) the reconcile Job
  ##   reconciles via POST /api/ssh-keys/{systemKey}/test-connection (idempotent; no
  ##   password — the public key must already be deployed on each target). Each entry
  ##   is { host, username, port }; the connection is created with Borg UI defaults
  ##   (use_sftp_mode=true, Hetzner-friendly). Requires the system key (auto-imported).
  remoteMachines: []
  #  - { host: "borg01.example.com", username: "u12345", port: 23 }
  ## @param borgUI.notifications Notification channels the reconcile Job provisions.
  ##   Matched by name: a missing channel is created, an existing one is updated
  ##   when its URL or a setting named here differs, an equal one is not written.
  ##   Channels under other names (e.g. made in the UI) are never touched, and
  ##   removing an entry here does NOT delete its channel. A channel the server
  ##   rejects is a warning in the Job log, not a failed release. Per entry:
  ##     name                    required, unique
  ##     email                   an e-mail channel; the Job assembles the Apprise
  ##                             mailto(s):// URL from these fields:
  ##       smtp.host             required, the SMTP server
  ##       smtp.port             optional (Apprise default: 587 starttls, 465 ssl, 25 insecure)
  ##       smtp.mode             starttls (default) | ssl | insecure
  ##       username              optional SMTP login
  ##       password              the SMTP password: value (goes into the chart Secret)
  ##                             or existingSecret+existingSecretKey; needs username
  ##       from, fromName        sender address (required) and display name
  ##       to, cc, bcc           lists of addresses (to: at least one)
  ##       replyTo               optional address
  ##     serviceUrl              instead of email: any other Apprise URL (slack://,
  ##                             json://, …) as a whole, value or existingSecret+
  ##                             existingSecretKey — it carries its credentials
  ##     enabled                 default true; a channel disabled in the UI is
  ##                             enabled again on the next reconcile
  ##     titlePrefix, includeJobNameInTitle, monitorAllRepositories
  ##     events                  overrides of the notify_on_* flags, camelCase:
  ##                             backupStart backupSuccess backupWarning backupFailure
  ##                             restoreSuccess restoreFailure checkSuccess checkFailure
  ##                             restoreCheckSuccess restoreCheckFailure scheduleFailure
  ##                             staleBackup backupReport
  ##   Only the settings an entry names are enforced; the rest start at the API
  ##   defaults (every failure event, stale backups and the backup report on; start,
  ##   success and warning off) and keep what the UI sets later. The repository
  ##   selection behind monitorAllRepositories=false is left to the UI.
  notifications: []
  #  - name: ops-mail
  #    email:
  #      smtp: { host: smtp.example.com, port: 587, mode: starttls }
  #      username: alerts@example.com
  #      password: { existingSecret: borgui-mail, existingSecretKey: password }
  #      from: alerts@example.com
  #      fromName: "Borg UI"
  #      to: [ops@example.com]
  #    titlePrefix: "[prod]"
  #  - name: chat
  #    serviceUrl: { existingSecret: borgui-notifications, existingSecretKey: chat }

## @section Persistence
## Operational volumes only: the Borg client cache, the Borg UI server state, and
## the managed-agent config/enrollment. (The backup *sources* are yours — mount
## them via extraVolumes.) Each volume can use an existing PVC, or the chart
## creates one (+ an optional static NFS PV via createPV).
##
## `retain: true` sets the PV reclaim policy to Retain AND adds
## helm.sh/resource-policy: keep to the PVC, so `helm uninstall` does NOT delete
## it — your Borg UI instance, config and agent enrollment survive and a
## re-install over the top picks them back up. `retain: false` lets uninstall
## remove the volume (fine for the disposable cache).
##
persistence:
  cache:
    ## @param persistence.cache.retain Keep the PVC/PV on uninstall (disposable → false)
    retain: false
    existingClaim: ""
    createPV: false
    server: "nfs.example.com"
    path: "/storage/shared/cluster/static/k8s-borg-cache"
    size: 5Gi
    storageClassName: ""
  ui:
    ## @param persistence.ui.retain Keep the Borg UI /data PVC/PV on uninstall (config survives)
    retain: true
    existingClaim: ""
    createPV: false
    server: "nfs.example.com"
    path: "/storage/shared/cluster/static/k8s-borg-ui"
    size: 5Gi
    storageClassName: ""
  uiAgent:
    ## @param persistence.uiAgent.retain Keep the agent config PVC/PV on uninstall (avoids re-enrollment)
    retain: true
    existingClaim: ""
    createPV: false
    server: "nfs.example.com"
    path: "/storage/shared/cluster/static/k8s-borg-ui-agent"
    size: 10Mi
    storageClassName: ""

## @section Repository server (optional; Borg 2 over ssh)
## A Borg 2 repository server inside the release: sshd as the unprivileged user
## `borg`, every client key bound to `borg serve --rest` for its own path below
## the data directory. It runs from the agent image, so server and clients always
## carry the same Borg 2 and borgstore. One replica, data on one node.
##
## Borg 2 is a beta and its repository format has changed more than once without
## a conversion path. Repositories on this server are test beds, not backups to
## rely on.
##
## Clients address a repository as
##   ssh://borg@<host>:<port>/<path>/<repository>     (Borg 2.0.0b25 and later)
##   rest://borg@<host>:<port>/<path>/<repository>    (up to Borg 2.0.0b24)
## The path is relative to the data directory. Nothing is wired up for the
## workloads of this release: set borg.repoBase and the known_hosts entry
## yourself, as for any other server.
##
## Server and clients share ONE Secret, the ssh Secret (section `ssh` above). The
## server takes from it:
##   ssh_host_ed25519_key   its host key
##   authorized_keys        the clients' public keys, one per line in the usual
##                          form "<type> <key> <name>". The comment names the client.
## An init container rewrites every line into one that binds the key to
## `borg serve` for a single directory, and stages it together with the host key
## with the modes sshd insists on. The server container itself mounts neither the
## Secret nor anything it could write to.
##
## A new client is one more line in authorized_keys: it gets the directory named
## after it, and repoServer.defaultPermissions. The pod reads the Secret at start
## — restart it after a change.
##
repoServer:
  ## @param repoServer.enabled Deploy the repository server
  enabled: false
  ## @param repoServer.port Port sshd listens on in the pod (1024 or higher: sshd is unprivileged)
  port: 2222
  ## @param repoServer.runAsUser uid of the user `borg` the server runs as. The data directory has
  ## to belong to it; the server sets the directory to mode 0700 and creates everything below it
  ## readable for this user only. Deliberately not a uid other charts commonly run as — a second
  ## workload with the same number on the node could read the repositories.
  runAsUser: 20222
  ## @param repoServer.runAsGroup gid of the group `borg`
  runAsGroup: 20222
  ## @param repoServer.borg1 Serve Borg 1 repositories as well (`borg serve`). The client decides by
  ## the way it asks; the directory a key is confined to is the same for both. Borg 1 knows no
  ## permissions, only append-only: `no-delete` becomes --append-only, and a key that may only
  ## read or only write gets no Borg 1 access.
  borg1: true
  ## @param repoServer.defaultPermissions What a client may do unless listed below:
  ## all | no-delete | write-only | read-only. Enforced by the server (`borg serve --permissions`).
  defaultPermissions: all
  ## @param repoServer.clients Optional. Another directory or other permissions for single clients:
  ##   name         the client, as named by the comment of its key
  ##   path         directory below the data directory the client is confined to
  ##                (default: its name). Repositories are created on demand anywhere
  ##                below it. Relative, no "..". Clients may share a directory, e.g.
  ##                a second key that may only read.
  ##   permissions  default: repoServer.defaultPermissions
  ## A name that matches no key stops the start: it is most likely a typo.
  clients: []
  #  - name: cluster-b
  #    permissions: no-delete
  #  - name: restore-test
  #    path: cluster-b
  #    permissions: read-only
  service:
    ## @param repoServer.service.type ClusterIP | NodePort | LoadBalancer. Pods of the cluster reach
    ## the server by the Service name with every type; NodePort and LoadBalancer add a way in for
    ## clients outside the cluster.
    type: ClusterIP
    ## @param repoServer.service.port Service port
    port: 2222
    ## @param repoServer.service.nodePort Fixed node port (NodePort and LoadBalancer; empty = assigned)
    nodePort: ""
    ## @param repoServer.service.loadBalancerIP Requested address (LoadBalancer). Newer load balancers
    ## take it from an annotation instead, see annotations.
    loadBalancerIP: ""
    ## @param repoServer.service.loadBalancerClass Load balancer implementation (LoadBalancer; empty = default)
    loadBalancerClass: ""
    ## @param repoServer.service.loadBalancerSourceRanges Networks allowed in (LoadBalancer), e.g. ["192.0.2.0/24"]
    loadBalancerSourceRanges: []
    ## @param repoServer.service.externalTrafficPolicy Cluster | Local (NodePort and LoadBalancer). Local
    ## keeps the client address in the sshd log, and only the node running the pod answers.
    externalTrafficPolicy: Cluster
    ## @param repoServer.service.annotations Service annotations, e.g. metallb.io/loadBalancerIPs
    annotations: {}
  ## Where the repositories live. One of:
  ##   existingClaim       a claim you manage
  ##   local.createPV      a static `local` PersistentVolume for a directory on one
  ##                       node, plus its claim. The volume pins the pod to that node.
  ##   neither             a claim from storageClassName (or the default class)
  ## In every case the directory has to exist and belong to runAsUser — the chart
  ## does not change ownership. Volume and claim created by the chart are kept on
  ## uninstall.
  persistence:
    ## @param repoServer.persistence.existingClaim Use an existing claim
    existingClaim: ""
    ## @param repoServer.persistence.size Size of the claim (and of the local volume)
    size: 100Gi
    ## @param repoServer.persistence.storageClassName StorageClass of the claim (not used with local.createPV)
    storageClassName: ""
    local:
      ## @param repoServer.persistence.local.createPV Create a static local PersistentVolume
      createPV: false
      ## @param repoServer.persistence.local.nodeName Node holding the directory (its kubernetes.io/hostname label)
      nodeName: ""
      ## @param repoServer.persistence.local.path Directory on that node
      path: ""
  ## @param repoServer.resources Container resources
  resources: {}
  ## @param repoServer.nodeSelector Node selector (not needed with local.createPV, which pins by itself)
  nodeSelector: {}
  ## @param repoServer.affinity Affinity
  affinity: {}
  ## @param repoServer.tolerations Tolerations, for a storage node that is tainted
  tolerations: []
  ## @param repoServer.podAnnotations Extra pod annotations
  podAnnotations: {}
