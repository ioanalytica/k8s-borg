## @section Node backup (DaemonSet)
##
node:
  ## @param node.enabled Deploy the node-backup DaemonSet
  enabled: true
  ## @param node.backupMode How node backups run: "interval" (legacy in-pod loop
  ##   every backupIntervalSeconds) or "agent" (enroll each DaemonSet pod as a
  ##   managed agent and register a per-node backup plan in Borg UI). "agent"
  ##   requires a reachable server (borgUI.agentConnection.server or an in-cluster
  ##   Borg UI). Node schedules then come from borg.backupSchedule/checkSchedule.
  backupMode: interval
  ## @param node.backupIntervalSeconds Sleep between node backups (backupMode=interval only)
  backupIntervalSeconds: 3600
  ## @param node.hostRootPath Host path mounted read-only at /node
  hostRootPath: /
  ## @param node.tolerations Tolerations (backups run on every node by default)
  tolerations:
    - operator: Exists
      effect: NoSchedule
  ## @param node.containerSecurityContext Node container security context (privileged: reads node FS, FUSE)
  containerSecurityContext:
    privileged: true
    capabilities:
      add:
        - SYS_ADMIN
  ## @param node.resources Node container resources
  resources: {}
  ## @param node.agentScripts Pre/post-backup scripts published to the managed agent (backupMode=agent).
  ##   Map of filename -> script body. Each entry is mounted read-only and executable at
  ##   /etc/borg-ui-agent-scripts and becomes selectable as a pre/post-backup hook in Borg UI.
  ##   The agent only ever runs scripts from this allow-list. Example:
  ##   agentScripts:
  ##     pre-db-dump.sh: |
  ##       #!/bin/sh
  ##       # borg-ui: Dump the local database before backup
  ##       pg_dumpall > /var/backups/db.sql
  agentScripts: {}

## @section Cluster backup (CronJob)
##
cluster:
  ## @param cluster.enabled Back up cluster-scope data at all (the S3/NFS/DB sources)
  enabled: true
  ## @param cluster.backupMode ONLY selects HOW the cluster backup is scheduled
  ##   (not who talks to Borg UI): "cronjob" → a k8s CronJob runs the backup on
  ##   cluster.schedule; "plan" → a server-side BackupPlan in Borg UI runs it. The
  ##   two are mutually exclusive. "plan" is registered by the console/app pod, so
  ##   it requires app.enabled=true and app.mode=agent. Plan/check schedules come
  ##   from borg.backupSchedule/checkSchedule (keyed by app.nodeName).
  backupMode: cronjob
  ## @param cluster.schedule Cron schedule (backupMode=cronjob only)
  schedule: "0 */6 * * *"
  ## @param cluster.timeZone CronJob time zone (defaults to .timezone)
  timeZone: ""
  ## @param cluster.nodeName Logical NODE_NAME for cluster archives
  nodeName: "k8s-borg-mycluster"
  ## @param cluster.concurrencyPolicy CronJob concurrency policy
  concurrencyPolicy: Forbid
  ## @param cluster.containerSecurityContext Cluster container security context
  containerSecurityContext:
    privileged: true
    capabilities:
      add:
        - SYS_ADMIN
  ## @param cluster.resources Cluster container resources
  resources: {}
  ## Scheduling — pin the cluster backup to the node that holds its backup-source
  ## storage. A node-local PVC (see cluster.extraVolumes) is only mountable on its
  ## own node, and that node is typically tainted, so nodeSelector/affinity select
  ## it and tolerations let the pod land there.
  ## @param cluster.nodeSelector Node selector for the cluster CronJob pod
  nodeSelector: {}
  ## @param cluster.affinity Affinity for the cluster CronJob pod
  affinity: {}
  ## @param cluster.tolerations Tolerations for the cluster CronJob pod
  tolerations: []
  ## Volumes scoped to the cluster CronJob ONLY (in addition to the global
  ## .extraVolumes). Use for the cluster backup source/cache, e.g. a node-local
  ## PVC that gives borg a stable mount so file attributes survive between runs
  ## (a re-mounted NFS changes them and forces a full, hours-long re-backup).
  ## @param cluster.extraVolumes Extra volumes for the cluster CronJob only
  extraVolumes: []
  ## @param cluster.extraVolumeMounts Extra volume mounts for the cluster CronJob only
  extraVolumeMounts: []

## @section Console app (StatefulSet)
## The long-lived console pod = the "cluster node" that represents the cluster
## repository in Borg UI.
##
app:
  ## @param app.enabled Deploy the console StatefulSet
  enabled: true
  ## @param app.mode Console pod behaviour: "legacy" (inspection only — tails the
  ##   log, kubectl exec in) or "agent" (fully enrol at Borg UI: register the
  ##   cluster repository + check-schedule so it is browsable in the UI, and run
  ##   the agent). In "agent" mode it registers a BackupPlan ONLY when
  ##   cluster.backupMode=plan — otherwise backups are driven elsewhere (CronJob)
  ##   and the agent just makes the repo visible. Needs a reachable Borg UI
  ##   (borgUI.agentConnection.server or an in-cluster borgUI.enabled server).
  mode: legacy
  ## @param app.nodeName Logical NODE_NAME for the console pod (also its Borg UI agent/repo/schedule key)
  nodeName: "k8s-borg-mycluster"
  ## @param app.containerSecurityContext App container security context
  containerSecurityContext:
    privileged: true
    capabilities:
      add:
        - SYS_ADMIN
  ## @param app.resources App container resources
  resources: {}
  ## Scheduling — the console/app pod represents the cluster repository and needs
  ## access to the same cluster-backup storage as the CronJob, so it is pinned the
  ## same way (node-local PVC → nodeSelector/affinity + tolerations for the taint).
  ## @param app.nodeSelector Node selector for the console StatefulSet pod
  nodeSelector: {}
  ## @param app.affinity Affinity for the console StatefulSet pod
  affinity: {}
  ## @param app.tolerations Tolerations for the console StatefulSet pod
  tolerations: []
  ## Volumes scoped to the console/app pod ONLY (in addition to the global
  ## .extraVolumes). Typically the same node-local PVC as cluster.extraVolumes so
  ## the app can read the cluster backup source/cache.
  ## @param app.extraVolumes Extra volumes for the console StatefulSet only
  extraVolumes: []
  ## @param app.extraVolumeMounts Extra volume mounts for the console StatefulSet only
  extraVolumeMounts: []

## @section Borg UI (optional; DEV/TEST)
##
borgUI:
  ## @param borgUI.enabled Deploy the Borg UI server (Deployment/Service/Ingress)
  enabled: false
  image:
    ## @param borgUI.image.registry Borg UI server image registry
    registry: ghcr.io
    ## @param borgUI.image.repository Borg UI server image repository
    repository: ioanalytica/k8s-borg-ui
    ## @param borgUI.image.tag Borg UI server image tag
    tag: "2.2.5"
    ## @param borgUI.image.pullPolicy Borg UI server image pull policy
    pullPolicy: IfNotPresent
  ## @param borgUI.publicBaseUrl Public base URL advertised by the server
  publicBaseUrl: "https://borgui.example.com"
  ## @param borgUI.adminUser Admin username (the Borg UI server hardcodes "admin"; kept for enrollment login)
  adminUser: "admin"
  ## Admin password. Drives the server's INITIAL_ADMIN_PASSWORD *and* agent enrollment
  ## login — they must match. Sensitive: value or existingSecret[+existingSecretKey].
  adminPassword:
    value: ""
    existingSecret: ""
    existingSecretKey: ""
  service:
    ## @param borgUI.service.type Borg UI Service type
    type: ClusterIP
    ## @param borgUI.service.port Borg UI Service port
    port: 8081
  ingress:
    ## @param borgUI.ingress.enabled Expose the Borg UI via Ingress
    enabled: false
    ## @param borgUI.ingress.ingressClassName Ingress class
    ingressClassName: traefik
    ## @param borgUI.ingress.host Ingress host
    host: "borgui.example.com"
    ## @param borgUI.ingress.annotations Ingress annotations (restrict exposure to trusted networks!)
    annotations: {}
    tls:
      ## @param borgUI.ingress.tls.enabled Enable TLS
      enabled: true
      ## @param borgUI.ingress.tls.secretName TLS Secret name
      secretName: "borgui-tls"
  ## @param borgUI.resources Borg UI server resources
  resources: {}
  ## Archive-listing cache backend for the Borg UI server.
  ##   disabled → the server keeps its in-memory cache (lost on every UI-pod roll).
  ##   internal → deploy a dedicated Redis pod (its OWN Deployment, NOT a sidecar —
  ##              survives UI-pod rolls and, if scaled, is shared across workers).
  ##   external → point the server at an existing Redis instance.
  ## The server auto-selects Redis over in-memory when REDIS_URL/REDIS_HOST is set.
  redis:
    ## @param borgUI.redis.mode Cache backend: disabled | internal | external
    mode: disabled
    ## Password shared by the server and (for internal) the Redis pod. Empty → no
    ## auth. Sensitive: value or existingSecret[+existingSecretKey] (key REDIS_PASSWORD).
    auth:
      value: ""
      existingSecret: ""
      existingSecretKey: ""
    ## @param borgUI.redis.cacheTtlMinutes Cached-listing TTL in minutes (matches the UI). Empty → server default (120). Reconciled into the DB by the reconcile Job.
    cacheTtlMinutes: ""
    ## Internal Redis pod (mode=internal).
    internal:
      image:
        registry: docker.io
        repository: redis
        tag: "7.4-alpine"
        pullPolicy: IfNotPresent
      ## @param borgUI.redis.internal.maxmemory Redis maxmemory cap (cache size)
      maxmemory: "256mb"
      ## @param borgUI.redis.internal.maxmemoryPolicy Eviction policy when full
      maxmemoryPolicy: "allkeys-lru"
      ## Persistence for the Redis pod. A cache survives a Redis-pod restart if
      ## enabled; otherwise it just re-fills. Off by default — the win here is
      ## surviving UI-pod rolls, which needs only a separate pod, not a PVC.
      persistence:
        enabled: false
        existingClaim: ""
        storageClassName: ""
        size: 1Gi
      ## @param borgUI.redis.internal.resources Redis pod resources
      resources: {}
      ## @param borgUI.redis.internal.nodeSelector Redis pod nodeSelector
      nodeSelector: {}
      ## @param borgUI.redis.internal.tolerations Redis pod tolerations
      tolerations: []
      ## @param borgUI.redis.internal.affinity Redis pod affinity
      affinity: {}
    ## External Redis (mode=external).
    external:
      ## @param borgUI.redis.external.url Full URL redis://[:password@]host:port/db — takes precedence if set
      url: ""
      ## @param borgUI.redis.external.host Host (used when url is empty; password from redis.auth)
      host: ""
      ## @param borgUI.redis.external.port Port
      port: 6379
      ## @param borgUI.redis.external.db Database number
      db: 0
  ## How managed agents reach the Borg UI server. Which components actually enrol
  ## as agents is decided per component: node.backupMode=agent and
  ## cluster.backupMode=plan. (The server itself is never an agent — hence the
  ## name.) Enrolment still uses the admin user/password above; PAT-based agent
  ## auth is a later phase.
  agentConnection:
    ## @param borgUI.agentConnection.server Borg UI server URL. Empty → derived from the in-cluster Service.
    server: ""
  ## Reconcile Job (Helm post-install/upgrade hook): waits for the server, mints
  ## (and reuses) an admin PAT into a retained Secret, and reconciles OIDC/SSO,
  ## the system SSH key and remote machines to match this HelmRelease every run.
  ## Runs the k8s-borg agent image (ships reconcile-borgui).
  reconcile:
    ## @param borgUI.reconcile.enabled Run the reconcile Job (only meaningful with borgUI.enabled)
    enabled: true
    ## @param borgUI.reconcile.patName Name of the PAT minted for admin/agent auth
    patName: "k8s-borg-reconcile"
    ## @param borgUI.reconcile.waitSeconds How long to wait for the server /health
    waitSeconds: 300
  ## OIDC / SSO. Reconciled declaratively by the reconcile Job (all fields the Borg
  ## UI settings dialog exposes). Only applied when oidc.enabled and the reconcile
  ## Job runs. Empty string = leave the server default.
  oidc:
    ## @param borgUI.oidc.enabled Enable OIDC login on the server
    enabled: false
    ## @param borgUI.oidc.discoveryUrl OIDC provider discovery URL (.well-known/openid-configuration)
    discoveryUrl: ""
    ## @param borgUI.oidc.clientId OIDC client ID
    clientId: ""
    ## OIDC client secret (sensitive): value or existingSecret[+existingSecretKey].
    clientSecret:
      value: ""
      existingSecret: ""
      existingSecretKey: ""
    ## @param borgUI.oidc.providerName Display name of the provider (login button)
    providerName: ""
    ## @param borgUI.oidc.tokenAuthMethod Token endpoint auth: client_secret_post | client_secret_basic
    tokenAuthMethod: "client_secret_post"
    ## @param borgUI.oidc.scopes OAuth scopes to request
    scopes: "openid profile email"
    ## @param borgUI.oidc.redirectUriOverride Override the auto-derived redirect URI (empty = auto)
    redirectUriOverride: ""
    ## @param borgUI.oidc.endSessionEndpointOverride Override the provider logout endpoint (empty = auto)
    endSessionEndpointOverride: ""
    ## @param borgUI.oidc.claimUsername ID-token claim used for the username
    claimUsername: "preferred_username"
    ## @param borgUI.oidc.claimEmail ID-token claim used for the email
    claimEmail: "email"
    ## @param borgUI.oidc.claimFullName ID-token claim used for the full name
    claimFullName: "name"
    ## @param borgUI.oidc.groupClaim ID-token claim carrying the group list (e.g. Zitadel: urn:zitadel:iam:org:project:roles)
    groupClaim: ""
    ## @param borgUI.oidc.roleClaim ID-token claim carrying the role directly (empty = derive from groups)
    roleClaim: ""
    ## @param borgUI.oidc.adminGroups Comma-separated groups that receive the admin role
    adminGroups: ""
    ## @param borgUI.oidc.allRepositoriesRoleClaim Claim carrying the per-all-repositories role
    allRepositoriesRoleClaim: ""
    ## @param borgUI.oidc.newUserMode How to handle first-seen OIDC users: deny | viewer | pending | template
    newUserMode: "viewer"
    ## @param borgUI.oidc.newUserTemplateUsername Template user to copy permissions from (newUserMode=template)
    newUserTemplateUsername: ""
    ## @param borgUI.oidc.defaultRole Global role granted to new OIDC users
    defaultRole: "viewer"
    ## @param borgUI.oidc.defaultAllRepositoriesRole Per-all-repositories role granted to new OIDC users
    defaultAllRepositoriesRole: "viewer"
    ## @param borgUI.oidc.disableLocalAuth Disable local password login (OIDC-only). Guarded: kept ON until an OIDC admin can sign in.
    disableLocalAuth: false
  ## Import the pods' SSH key (ssh.existingSecret) as the Borg UI *system* SSH key,
  ## so the server reaches ssh:// repos and remote machines with the SAME identity
  ## the backup pods use (its public key is already on those targets). An init
  ## container stages the key for the server user (uid 1001) — a plain secret mount
  ## would have the wrong owner/mode. The reconcile Job then imports it once
  ## (POST /api/ssh-keys/import) and it lives encrypted in the Borg UI DB.
  ## Enabling remoteMachines below implies this import.
  systemSshKey:
    ## @param borgUI.systemSshKey.import Import ssh.existingSecret as the Borg UI system SSH key
    import: false
    ## @param borgUI.systemSshKey.name Name for the imported system key
    name: "k8s-borg-system"
  ## @param borgUI.remoteMachines Remote machines (SSH connections) the reconcile Job
  ##   reconciles via POST /api/ssh-keys/{systemKey}/test-connection (idempotent; no
  ##   password — the public key must already be deployed on each target). Each entry
  ##   is { host, username, port }; the connection is created with Borg UI defaults
  ##   (use_sftp_mode=true, Hetzner-friendly). Requires the system key (auto-imported).
  remoteMachines: []
  #  - { host: "borg01.example.com", username: "u12345", port: 23 }

## @section Persistence
## Operational volumes only: the Borg client cache, the Borg UI server state, and
## the managed-agent config/enrollment. (The backup *sources* are yours — mount
## them via extraVolumes.) Each volume can use an existing PVC, or the chart
## creates one (+ an optional static NFS PV via createPV).
##
## `retain: true` sets the PV reclaim policy to Retain AND adds
## helm.sh/resource-policy: keep to the PVC, so `helm uninstall` does NOT delete
## it — your Borg UI instance, config and agent enrollment survive and a
## re-install over the top picks them back up. `retain: false` lets uninstall
## remove the volume (fine for the disposable cache).
##
persistence:
  cache:
    ## @param persistence.cache.retain Keep the PVC/PV on uninstall (disposable → false)
    retain: false
    existingClaim: ""
    createPV: false
    server: "nfs.example.com"
    path: "/storage/shared/cluster/static/k8s-borg-cache"
    size: 5Gi
    storageClassName: ""
  ui:
    ## @param persistence.ui.retain Keep the Borg UI /data PVC/PV on uninstall (config survives)
    retain: true
    existingClaim: ""
    createPV: false
    server: "nfs.example.com"
    path: "/storage/shared/cluster/static/k8s-borg-ui"
    size: 5Gi
    storageClassName: ""
  uiAgent:
    ## @param persistence.uiAgent.retain Keep the agent config PVC/PV on uninstall (avoids re-enrollment)
    retain: true
    existingClaim: ""
    createPV: false
    server: "nfs.example.com"
    path: "/storage/shared/cluster/static/k8s-borg-ui-agent"
    size: 10Mi
    storageClassName: ""
