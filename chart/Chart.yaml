apiVersion: v2
name: k8s-borg
version: 1.3.2
appVersion: "1.3.2"

description: >-
  Backup for Kubernetes clusters with BorgBackup. Deploys a node-backup
  DaemonSet, a cluster-data-backup CronJob, and a console StatefulSet, each
  talking to its own Borg repository. Optional Borg UI server with managed
  agents, and an optional Borg 1/Borg 2 repository server.
home: https://k8s-borg.ioanalytica.com
icon: https://raw.githubusercontent.com/ioanalytica/k8s-borg/main/icon.png
sources:
  - https://github.com/ioanalytica/k8s-borg

maintainers:
  - name: IO ANALYTICA
    url: https://ioanalytica.com

keywords:
  - backup
  - borg
  - borgbackup
  - kubernetes
  - disaster-recovery

# What Artifact Hub shows for the chart (artifacthub.io/docs/topics/annotations/helm).
# A release adds artifacthub.io/changes and artifacthub.io/prerelease when it
# packages the chart (scripts/artifacthub-annotations.sh); they are not written
# here. The images are every image the chart can run, at the tags values.yaml
# gives them (tests/chart-versions.bats); Artifact Hub scans them for CVEs.
annotations:
  artifacthub.io/category: storage
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Changelog
      url: https://k8s-borg.ioanalytica.com/reference/changelog
    - name: Verify the signatures
      url: https://k8s-borg.ioanalytica.com/security/verify
    - name: support
      url: https://github.com/ioanalytica/k8s-borg/issues
  artifacthub.io/images: |
    - name: k8s-borg
      image: ghcr.io/ioanalytica/k8s-borg:1.3.2
    - name: k8s-borg-ui
      image: ghcr.io/ioanalytica/k8s-borg-ui:2.4.6
    - name: redis
      image: docker.io/redis:7.4-alpine
    - name: busybox
      image: docker.io/busybox:1.37
    - name: kubectl
      image: docker.io/alpine/kubectl:1.37.2

dependencies:
  - name: common
    repository: oci://ghcr.io/ioanalytica/charts
    version: 0.1.x
