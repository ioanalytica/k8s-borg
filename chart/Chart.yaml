apiVersion: v2
name: k8s-borg
version: 1.2.0
appVersion: "1.2.0"

description: >-
  Backup for Kubernetes clusters with BorgBackup. Deploys a node-backup
  DaemonSet, a cluster-data-backup CronJob, and a console StatefulSet, each
  talking to its own Borg repository. Optional Borg UI server with managed
  agents, and an optional Borg 1/Borg 2 repository server.
home: https://github.com/ioanalytica/k8s-borg
icon: https://raw.githubusercontent.com/ioanalytica/k8s-borg/master/icon.png
sources:
  - https://github.com/ioanalytica/k8s-borg

maintainers:
  - name: IO ANALYTICA
    url: https://ioanalytica.com

keywords:
  - backup
  - borg
  - borgbackup
  - kubernetes
  - disaster-recovery

annotations:
  category: Storage
  licenses: AGPL-3.0-only
  images: |
    - name: k8s-borg
      image: ghcr.io/ioanalytica/k8s-borg:1.2.0
    - name: k8s-borg-ui
      image: ghcr.io/ioanalytica/k8s-borg-ui:2.4.1
    - name: redis
      image: docker.io/redis:7.4-alpine

dependencies:
  - name: common
    repository: oci://ghcr.io/ioanalytica/charts
    version: 0.1.x
