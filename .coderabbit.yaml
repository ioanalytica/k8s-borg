# CodeRabbit configuration.
#
# NB: CodeRabbit reads this file from the HEAD branch of a pull request — the
# branch under review — not from the base branch. Keeping it on develop is what
# makes branches cut from develop inherit it; a branch that already existed
# before this file has to pick it up, or CodeRabbit falls back to the settings
# in the CodeRabbit UI and skips the review.

language: en-US

reviews:
  # develop is the integration branch: master lags well behind it, so nearly
  # every pull request here targets develop. Without this, CodeRabbit reviews
  # only the default branch and skips them with "reviews are disabled for this
  # base branch". The default branch stays covered implicitly.
  base_branches:
    - develop
