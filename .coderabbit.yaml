# CodeRabbit configuration.
#
# NB: CodeRabbit reads this file from the BASE branch of a pull request, not
# from the branch under review. It therefore has to live on develop for pull
# requests targeting develop to be reviewed at all — adding it inside such a
# pull request has no effect on that pull request.

language: en-US

reviews:
  # develop is the integration branch: master lags well behind it, so nearly
  # every pull request here targets develop. Without this, CodeRabbit reviews
  # only the default branch and skips them with "reviews are disabled for this
  # base branch". The default branch stays covered implicitly.
  base_branches:
    - develop
