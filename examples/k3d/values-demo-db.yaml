# On top of values.yaml: the cluster backup dumps the PostgreSQL of
# demo-db.yaml and archives the dump. The console pod reads the credentials
# from the database's own Secret when it starts.

databases:
  postgres:
    enabled: true
    instances:
      - name: shop
        host: demo-db.demo.svc
        secretRef:
          namespace: demo
          name: demo-db
          usernameKey: username
          passwordKey: password

borg:
  # The dumps, one directory per instance, in the pods' scratch volume.
  dbBackupLocation: /mnt/db-backup

cluster:
  include:
    - "P fm"
    - "R /mnt/db-backup"

# The page installs the latest release. Up to 1.2.3 the console pod registers
# its plan with the roots that exist when it starts, before the first dump is
# written by the plan's own pre-backup hook; later charts create the directory.
mountPoints:
  - /mnt/db-backup
