# On top of values.yaml: the cluster backup dumps the PostgreSQL of
# demo-db.yaml and archives the dump. The console pod reads the credentials
# from the database's own Secret when it starts.

databases:
  postgres:
    enabled: true
    instances:
      - name: shop
        host: demo-db.demo.svc
        secretRef:
          namespace: demo
          name: demo-db
          usernameKey: username
          passwordKey: password

borg:
  # The dumps, one directory per instance, in the pods' scratch volume.
  dbBackupLocation: /mnt/db-backup

cluster:
  include:
    - "P fm"
    - "R /mnt/db-backup"
