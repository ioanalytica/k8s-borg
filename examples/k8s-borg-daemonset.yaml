apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-borg-node
  labels:
    app: k8s-borg-node
    release: k8s-borg
spec:
  selector:
    matchLabels:
      app: k8s-borg-node
  template:
    metadata:
      labels:
        app: k8s-borg-node
    spec:
      restartPolicy: Always
      tolerations:
        - operator: Exists
          effect: NoSchedule
      volumes:
        - name: ssh-credentials
          emptyDir:
            medium: Memory
        - name: k8s-borg-ssh-secret
          secret:
            secretName: k8s-borg-ssh-secret
            defaultMode: 384
        - name: k8s-borg-config
          configMap:
            name: k8s-borg-config
            defaultMode: 384
        - name: k8s-borg-nfs-volume
          persistentVolumeClaim:
            claimName: k8s-borg-nfs-pvc
        - name: rootfs
          hostPath:
            path: /
            type: Directory
        - name: k8s-borg-cache-volume
          persistentVolumeClaim:
            claimName: k8s-borg-cache-pvc
        - name: k8s-borg-ui-agent-volume
          persistentVolumeClaim:
            claimName: k8s-borg-ui-agent-pvc
      initContainers:
        - name: configure
          image: busybox
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/sh
            - -c
            - |
              echo "Setting ssh configuration for $(POD_NAME) …"
              cp /mnt/ssh/id* /ssh/
              cp /mnt/ssh/known_hosts /ssh/
              chown -R 0:0 /ssh
              chmod 700 /ssh
              chmod 600 /ssh/*
          volumeMounts:
            - name: ssh-credentials
              mountPath: /ssh
            - name: k8s-borg-ssh-secret
              mountPath: /mnt/ssh
              readOnly: true
      containers:
        - name: k8s-borg-app
          image: ghcr.io/ioanalytica/k8s-borg:1.0.4
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Set the pod hostname to the node it runs on (NODE_NAME = spec.nodeName).
              # Prefer hostname(1); fall back to procfs if the binary is absent (container is privileged).
              hostname "k8s-borg-${NODE_NAME}" 2>/dev/null || printf '%s' "${NODE_NAME}" > /proc/sys/kernel/hostname
              while true; do
                # Perform the backup task
                /run.sh run
                # Sleep for the desired interval (e.g., 1 hour)
                sleep 3600
              done
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          volumeMounts:
            - name: rootfs
              mountPath: /node
              readOnly: true
            - name: ssh-credentials
              mountPath: "/root/.ssh"
            - mountPath: "/root/.borg"
              name: k8s-borg-config
              readOnly: true
            - mountPath: "/mnt/nfs"
              name: k8s-borg-nfs-volume
            - mountPath: "/root/.cache"
              name: k8s-borg-cache-volume
              subPathExpr: $(NODE_NAME)
            - mountPath: "/etc/borg-ui-agent"
              name: k8s-borg-ui-agent-volume
              subPathExpr: $(NODE_NAME)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: TZ
              value: Europe/Berlin
            - name: BORG_MODE
              value: node
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: S3_ENDPOINT
            - name: S3_MOUNTPOINT
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: S3_MOUNTPOINT
            - name: BORG_REPO_BASE
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: BORG_REPO_BASE
            - name: BORG_REPO
              value: "$(BORG_REPO_BASE)/$(NODE_NAME)"
            - name: BORG_VERSION
              value: "1"   # 1 | 2
            - name: BORG_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: BORG_PASSPHRASE
            - name: AWS_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: AWS_KEY
            - name: AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: AWS_SECRET_KEY
            - name: DB_BACKUP_LOCATION
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: DB_BACKUP_LOCATION
            - name: KEEP_DAILY
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: KEEP_DAILY
            - name: KEEP_WEEKLY
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: KEEP_WEEKLY
            - name: KEEP_MONTHLY
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: KEEP_MONTHLY
            - name: BORG_UI_AGENT
              value: "true"
            - name: BORG_UI_SERVER
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: BORG_UI_SERVER
            - name: BORG_UI_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: BORG_UI_ADMIN_USER
            - name: BORG_UI_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: k8s-borg-secret
                  key: BORG_UI_ADMIN_PASS
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  revisionHistoryLimit: 10
