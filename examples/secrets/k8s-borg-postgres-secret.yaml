---
# EXAMPLE — one *.conf per PostgreSQL instance, in pgpass format:
#   host:port:database:user:password   ( * = all databases )
# Mounted at /root/.postgres/ and consumed by `backup-postgres`.
apiVersion: v1
kind: Secret
metadata:
  name: k8s-borg-postgres-secret
  namespace: k8s-borg
stringData:
  postgres-example.conf: |
    postgres.databases.svc:5432:*:backup:<CHANGE_ME>
type: Opaque
