---
# EXAMPLE — replace every value below. Do NOT commit real credentials.
# In a real deployment keep this encrypted at rest (SOPS, Sealed Secrets,
# External Secrets Operator, …) rather than as a plain manifest.
# The keys are the ones ../helm/k8s-borg.yaml references via existingSecretKey.
apiVersion: v1
kind: Secret
metadata:
  name: k8s-borg-secret
  namespace: k8s-borg
stringData:
  # --- Borg repository (borg.repoBase, borg.passphrase) ---
  # Single base; each pod appends its node name to form its repository. The
  # transport is the URL scheme and is independent of the borg version:
  #   ssh://  — server has borg installed (works with borg 1 and 2), e.g. a
  #             Hetzner Storage Box on port 23
  #   sftp:// — plain SFTP target with no server-side borg (borg 2 only)
  # Borg 1 takes a path relative to the login directory as /./<path>, Borg 2 as
  # /<path> (and an absolute one as //<path>). Borg 2.0.0b25 and later know no
  # rest://.
  BORG_REPO_BASE: ssh://u123456@u123456.your-storagebox.de:23/./mycluster
  BORG_PASSPHRASE: <CHANGE_ME>
  # --- S3 sources (s3.accessKey, s3.secretKey) ---
  AWS_KEY: <CHANGE_ME>
  AWS_SECRET_KEY: <CHANGE_ME>
  # --- Borg UI (borgUI.adminPassword, borgUI.redis.auth,
  #     borgUI.oidc.clientSecret, the mail notification's password) ---
  BORG_UI_ADMIN_PASS: <CHANGE_ME>
  REDIS_PASSWORD: <CHANGE_ME>
  OIDC_CLIENT_SECRET: <CHANGE_ME>
  SMTP_PASSWORD: <CHANGE_ME>
type: Opaque
