---
# EXAMPLE — replace every value below. Do NOT commit real credentials.
# In a real deployment keep this encrypted at rest (SOPS, Sealed Secrets,
# External Secrets Operator, …) rather than as a plain manifest.
apiVersion: v1
kind: Secret
metadata:
  name: k8s-borg-secret
  namespace: k8s-borg
stringData:
  # --- Borg repository ---
  # Single base; each pod appends its node name to form BORG_REPO. The transport
  # is the URL scheme and is independent of the borg version:
  #   ssh://  — server has borg installed (works with borg 1 and 2)
  #   sftp:// — plain SFTP target with no server-side borg (borg 2 only,
  #             e.g. a Hetzner Storage Box)
  # BORG_VERSION (set per workload) only selects the borg 1 or 2 binary.
  BORG_REPO_BASE: ssh://<user>@<borg-host>:22/./<cluster>
  BORG_PASSPHRASE: <CHANGE_ME>
  # borg pattern / exclude files (paths inside the container)
  BORG_PATTERNS: /root/.borg/borg_patterns
  BORG_EXCLUDES: /root/.borg/borg_excludes
  BORG_NODE_PATTERNS: /root/.borg/borg_node_patterns
  BORG_NODE_EXCLUDES: /root/.borg/borg_node_excludes
  # --- S3 sources (cluster/app jobs; never mounted for node backups) ---
  S3_ENDPOINT: http://minio.minio.svc:9000
  S3_MOUNTPOINT: /mnt/s3
  S3_BUCKETS: /root/.s3_buckets/s3_buckets
  AWS_KEY: <CHANGE_ME>
  AWS_SECRET_KEY: <CHANGE_ME>
  # --- logical DB dumps ---
  DB_BACKUP_LOCATION: /mnt/nfs/data/db-backup
  # --- retention (safe defaults) ---
  KEEP_DAILY: "7"
  KEEP_WEEKLY: "4"
  KEEP_MONTHLY: "3"
  # --- optional Borg UI managed-agent enrollment (DEV/TEST only) ---
  BORG_UI_SERVER: http://k8s-borg-ui.k8s-borg.svc.cluster.local:8081
  BORG_UI_ADMIN_USER: <CHANGE_ME>
  BORG_UI_ADMIN_PASS: <CHANGE_ME>
type: Opaque
