---
# EXAMPLE — one *.conf per MariaDB instance, in MySQL "defaults-file" format.
# Mounted at /root/.mariadb/ and consumed by `backup-mariadb` (one logical dump
# per instance). Add more files for more instances.
apiVersion: v1
kind: Secret
metadata:
  name: k8s-borg-mariadb-secret
  namespace: k8s-borg
stringData:
  mariadb-example.conf: |
    [client]
    host = mariadb.databases.svc
    user = backup
    password = <CHANGE_ME>
type: Opaque
