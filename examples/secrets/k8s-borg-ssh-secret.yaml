---
# EXAMPLE — replace with your own keys (ssh.existingSecret).
# The backup pods use the client key and known_hosts; the repository server
# (repoServer.enabled) uses its host key and authorized_keys. See
# https://k8s-borg.ioanalytica.com/features/repository-server#one-secret
apiVersion: v1
kind: Secret
metadata:
  name: k8s-borg-ssh-secret
  namespace: k8s-borg
stringData:
  # The Borg client key of this cluster's backup pods.
  id_ed25519: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <CHANGE_ME: your Borg client private key>
    -----END OPENSSH PRIVATE KEY-----
  id_ed25519.pub: |
    ssh-ed25519 AAAA<CHANGE_ME> mycluster
  # The host key of the server in BORG_REPO_BASE (a port other than 22 in brackets).
  known_hosts: |
    [u123456.your-storagebox.de]:23 ssh-ed25519 AAAA<CHANGE_ME>
  # The repository server's own host key: ssh-keygen -t ed25519 -N "" -C "" -f ssh_host_ed25519_key
  ssh_host_ed25519_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <CHANGE_ME: the repository server's host key>
    -----END OPENSSH PRIVATE KEY-----
  # The repository server's clients, one key per line; the comment names the
  # client and its directory.
  authorized_keys: |
    ssh-ed25519 AAAA<CHANGE_ME> other-cluster
type: Opaque
