---
# EXAMPLE — replace with your own SSH keypair and the Borg host's known_hosts.
# The init container copies these into each pod's /root/.ssh (mode 600).
apiVersion: v1
kind: Secret
metadata:
  name: k8s-borg-ssh-secret
  namespace: k8s-borg
stringData:
  id_ed25519: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <CHANGE_ME: your Borg client private key>
    -----END OPENSSH PRIVATE KEY-----
  id_ed25519.pub: |
    ssh-ed25519 AAAA<CHANGE_ME> k8s-borg
  known_hosts: |
    <borg-host> ssh-ed25519 AAAA<CHANGE_ME>
type: Opaque
