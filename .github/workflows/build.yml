name: Build & push

# Release-tag pushes only. Branch pushes and pull requests are Lint & test's
# business; nothing here validates — everything here publishes, and the tag is
# what names the artifacts.
on:
  push:
    tags: ['*']

env:
  REGISTRY: ghcr.io
  OWNER: ioanalytica
  # Whom a release's signatures name (the sign job): this workflow, run for a
  # tag. README.md ("Verify the images") gives users the same expression.
  SIGNER: '^https://github\.com/ioanalytica/k8s-borg/\.github/workflows/build\.yml@refs/tags/'

jobs:
  # Green tests are a precondition for publishing, not a race against it. These
  # used to be two parallel workflows on the same trigger, and Build & push is
  # the faster one — on 2026-08-19 a tag push published images while the e2e
  # suite was busy failing that same commit, and pullPolicy Always pulls such
  # an image into a cluster on the next pod restart. Everything below that
  # publishes now sits downstream of this job.
  gate:
    uses: ./.github/workflows/lint-test.yml
    permissions:
      contents: read

  # Read the borg version pins once and expose them to the image builds. The
  # workflow only triggers on tags; the per-job refs/tags guards stay anyway,
  # so a future trigger addition cannot quietly turn branch pushes into
  # releases.
  prep:
    needs: gate
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      runtime_tag: ${{ steps.pins.outputs.tag }}
      borg1: ${{ steps.pins.outputs.borg1 }}
      borg2: ${{ steps.pins.outputs.borg2 }}
      borgstore: ${{ steps.pins.outputs.borgstore }}
      python: ${{ steps.pins.outputs.python }}
      app_version: ${{ steps.pins.outputs.app_version }}
      agent_edge: ${{ steps.pins.outputs.agent_edge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # Every image job needs this one, so failing here stops the whole release
      # instead of publishing images under a tag the chart does not carry.
      - name: Tag must match the chart version
        run: ./tests/check-release-tag.sh "$GITHUB_REF_NAME"
      - id: pins
        run: |
          . borg-ui/docker/runtime-base.env
          # The UI app version comes from the pinned submodule, never from a
          # literal here — a hardcoded copy silently drifts on a bump, and the
          # chart would then reference an image tag that was never built. It is
          # `git describe` of the pin (2.3.10-27-gcdd5712c9), not borg-ui/VERSION:
          # VERSION stays the same across many main commits, and reusing a tag
          # for another pin overwrites the image an older chart still names.
          # The fork the submodule comes from has no tags, hence --fetch-tags.
          app_version="$(./docker/ui-app-version.sh --fetch-tags)"
          # The managed agent's version stamp, from the same tags: the pin's
          # describe distance when the agent changed since the last release,
          # else nothing (docker/agent-version-stamp.sh). Computed once here so
          # the agent and the server image cannot get different ones.
          agent_edge="$(./docker/agent-version-stamp.sh)"
          # The gate's bats suite checks this too; here it is the very string
          # the image gets tagged with.
          . tests/helpers/versions.bash
          chart_ui_tag="$(values_tag ioanalytica/k8s-borg-ui)"
          if [ "$chart_ui_tag" != "$app_version" ]; then
            echo "✗ chart/values.yaml names k8s-borg-ui:$chart_ui_tag, the pinned borg-ui builds $app_version" >&2
            exit 1
          fi
          {
            echo "tag=$(./borg-ui/docker/runtime-base-tag.sh)"
            echo "borg1=$BORG1_VERSION"
            echo "borg2=$BORG2_VERSION"
            echo "borgstore=$BORGSTORE_VERSION"
            echo "python=$PYTHON_VERSION"
            echo "app_version=$app_version"
            echo "agent_edge=$agent_edge"
          } >> "$GITHUB_OUTPUT"

  agent:
    needs: prep
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: k8s-borg
      context: .
      file: ./docker/Dockerfile
      agent-edge: ${{ needs.prep.outputs.agent_edge }}
      # `latest` moves with releases only (here and in the two jobs below):
      # every version with a -suffix is a prerelease, a beta such as
      # 1.2.4-beta.1 as well as a chart revision such as 1.2.3-1.
      tags: |
        type=ref,event=branch
        type=sha,format=short
        type=semver,pattern={{version}}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

  runtime-base:
    needs: prep
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: k8s-borg-ui-runtime-base
      context: EMPTY
      file: ./borg-ui/Dockerfile.runtime-base
      build-args: |
        BORG1_VERSION=${{ needs.prep.outputs.borg1 }}
        BORG2_VERSION=${{ needs.prep.outputs.borg2 }}
        BORGSTORE_VERSION=${{ needs.prep.outputs.borgstore }}
        PYTHON_VERSION=${{ needs.prep.outputs.python }}
      tags: |
        type=raw,value=${{ needs.prep.outputs.runtime_tag }}
        type=ref,event=branch
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

  server:
    needs: [prep, runtime-base]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: k8s-borg-ui
      context: borg-ui
      file: ./borg-ui/Dockerfile
      agent-edge: ${{ needs.prep.outputs.agent_edge }}
      # The runtime base by the digest its job pushed: its tag follows only
      # in the tag job, once the release is signed.
      build-args: |
        BASE_IMAGE=ghcr.io/ioanalytica/k8s-borg-ui-runtime-base@${{ needs.runtime-base.outputs.digest }}
        APP_VERSION=${{ needs.prep.outputs.app_version }}
        PYTHON_VERSION=${{ needs.prep.outputs.python }}
      tags: |
        type=raw,value=${{ needs.prep.outputs.app_version }}
        type=ref,event=branch
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

  chart:
    # Publishes on tags — it waits for the gate like the image jobs do, and
    # for the images, so a failed image build leaves no chart behind. The
    # chart goes into its repository under its digest alone; the tag job
    # gives it its version once it is signed.
    needs: [gate, agent, runtime-base, server]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    # helm push tags the chart's version as it pushes, so it pushes into this
    # registry on the runner, which goes with the job; oras copies the chart
    # from there into GHCR (the push step below).
    services:
      registry:
        image: registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
        ports:
          - 5000:5000
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # helm gets its own registry login; nothing needs a token left in
          # .git/config.
          persist-credentials: false
      # Pinned: without a version the action fetches "latest" from the
      # GitHub API and silently falls back to an old Helm 3 when that fails.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      # This job reads nothing of prep, so it runs the check of its own — and
      # it is the one that would do the damage: package the old version and
      # overwrite it in the registry.
      - name: Tag must match the chart version
        if: startsWith(github.ref, 'refs/tags/')
        run: ./tests/check-release-tag.sh "$GITHUB_REF_NAME"
      # A prerelease is tagged on the commit its release will be tagged on,
      # whose Chart.yaml says X.Y.Z: its chart gets the tag's version, and
      # with the appVersion the agent image this run built.
      - name: Chart version from the tag (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/chart-release-version.sh "$GITHUB_REF_NAME"
      # What Artifact Hub shows for this version: its changes, from the
      # CHANGELOG.md entry, and whether it is a prerelease. Written into the
      # chart before it is linted and packaged, so the pushed and signed chart
      # carries them.
      - name: Artifact Hub annotations (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/artifacthub-annotations.sh "$GITHUB_REF_NAME"
      - name: Lint & package
        run: |
          mkdir -p "$RUNNER_TEMP/chart"
          helm lint ./chart
          helm package ./chart --destination "$RUNNER_TEMP/chart"
      # The release job attaches this very file, the bytes of the chart layer
      # pushed below and then signed. Kept as long as GitHub lets a run's
      # failed jobs be re-run, so a sign job that failed on a Friday can still
      # publish the release on Monday. A re-run of this job after a failed
      # push packages again and replaces the package of the failed attempt
      # (overwrite), which would otherwise block the upload: the new package
      # is the one that gets pushed and signed.
      - name: Hand the package to the release job (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: ${{ runner.temp }}/chart/k8s-borg-*.tgz
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - uses: ./.github/actions/setup-oras
        if: startsWith(github.ref, 'refs/tags/')
      # helm pushes into the job's own registry, and names the manifest it
      # pushed ("Digest: sha256:…"). oras copies that digest into
      # charts/k8s-borg under no tag; content-addressed, the copy has the same
      # digest. The sign job signs it, and the tag job tags it.
      - name: Push chart to GHCR by digest (tags only)
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused -o /dev/null http://localhost:5000/v2/
          out="$(helm push "$RUNNER_TEMP"/chart/k8s-borg-*.tgz oci://localhost:5000/charts --plain-http)"
          echo "$out"
          digest="$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' <<<"$out")"
          [ -n "$digest" ] || { echo "✗ helm push reported no digest" >&2; exit 1; }
          echo "$TOKEN" | oras login "$REGISTRY" -u "$ACTOR" --password-stdin
          oras cp --from-plain-http "localhost:5000/charts/k8s-borg@$digest" "$REGISTRY/$OWNER/charts/k8s-borg"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Keyless Sigstore signatures for everything the release pushed to GHCR, each
  # by its digest: a tag can be moved to another manifest, the digest is what
  # was built, and until the tag job nothing of the release has a tag. An
  # image index lists the attestation manifests (SBOM and provenance) of its
  # platforms, so its signature covers those as well.
  # Fulcio certifies this job's GitHub OIDC token, the certificate names this
  # workflow at the release tag, and the signature is logged in the public
  # Rekor instance. The one job with an OIDC token: signing in build-image.yml
  # would name that workflow instead, and users would need a second identity.
  sign:
    needs: [agent, runtime-base, server, chart]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    # Signing and verifying take seconds; an unreachable Sigstore service must
    # not hold the release run for GitHub's six hours.
    timeout-minutes: 10
    permissions:
      packages: write        # cosign stores each signature next to its artifact
      id-token: write        # the token Fulcio issues the signing certificate for
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Verified right away with the command README.md gives users, so a
      # release cannot publish signatures that check fails on.
      - name: Sign by digest
        env:
          AGENT: ${{ env.REGISTRY }}/${{ env.OWNER }}/k8s-borg@${{ needs.agent.outputs.digest }}
          RUNTIME_BASE: ${{ env.REGISTRY }}/${{ env.OWNER }}/k8s-borg-ui-runtime-base@${{ needs.runtime-base.outputs.digest }}
          SERVER: ${{ env.REGISTRY }}/${{ env.OWNER }}/k8s-borg-ui@${{ needs.server.outputs.digest }}
          CHART: ${{ env.REGISTRY }}/${{ env.OWNER }}/charts/k8s-borg@${{ needs.chart.outputs.digest }}
        run: |
          cosign sign --yes "$AGENT" "$RUNTIME_BASE" "$SERVER" "$CHART"
          cosign verify "$AGENT" "$RUNTIME_BASE" "$SERVER" "$CHART" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$SIGNER" >/dev/null

  # The tags of the release, set once its digests are signed: each image's
  # tags from build-image.yml (the version, sha-…, the shared UI and runtime
  # base tags, `latest` for a release), Artifact Hub's repository metadata,
  # and the chart's version last. Until here every artifact of the release
  # sits in GHCR under its digest alone, so no tag names an unsigned one:
  # Artifact Hub indexes a chart version when its tag appears, and does not
  # check it again while its digest stays the same (1.3.2 is listed as
  # unsigned for that reason). A failed sign job leaves no tag behind; a
  # re-run of this job sets the same tags on the same digests again. A tag
  # moves only to the images of a later run: a late re-run of an older
  # release's failed jobs leaves `latest` and the shared tags on the newer
  # release's images.
  tag:
    needs: [agent, runtime-base, server, chart, sign]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # One tag job at a time across runs: reading which run a tag names and
    # moving it are two steps. The others wait in line (queue: max, up to 100)
    # instead of GitHub's one pending job, which a third would cancel.
    concurrency:
      group: build-tag
      queue: max
    permissions:
      contents: read         # artifacthub-repo.yml and the oras action
      packages: write        # tag the release's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-oras
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The images first: the chart, tagged last, names them by tag. Every
      # list and the run number of every index are checked before the first
      # tag is set.
      - name: Tag the images
        env:
          AGENT: ${{ env.REGISTRY }}/${{ env.OWNER }}/k8s-borg@${{ needs.agent.outputs.digest }}
          AGENT_TAGS: ${{ needs.agent.outputs.tags }}
          RUNTIME_BASE: ${{ env.REGISTRY }}/${{ env.OWNER }}/k8s-borg-ui-runtime-base@${{ needs.runtime-base.outputs.digest }}
          RUNTIME_BASE_TAGS: ${{ needs.runtime-base.outputs.tags }}
          SERVER: ${{ env.REGISTRY }}/${{ env.OWNER }}/k8s-borg-ui@${{ needs.server.outputs.digest }}
          SERVER_TAGS: ${{ needs.server.outputs.tags }}
        run: |
          # tags REF LIST — the tags of LIST (metadata-action's, one image:tag
          # a line) for REF (image@digest), one a line.
          tags() {
            local image="${1%@*}" t n=0
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              [[ "$t" == "$image:"* ]] || { echo "✗ $t is not a tag of $image" >&2; return 1; }
              t="${t#"$image:"}"
              # Every version with a -suffix is a prerelease.
              if [ "$t" = latest ] && [[ "$GITHUB_REF_NAME" == *-* ]]; then
                echo "✗ $GITHUB_REF_NAME is a prerelease: $image:latest stays where it is" >&2
                return 1
              fi
              echo "$t"
              n=$((n + 1))
            done <<<"$2"
            [ "$n" -gt 0 ] || { echo "✗ no tags for $image" >&2; return 1; }
          }
          # run_of REF — the Build & push run that built the index REF names
          # (build-image.yml), or nothing for an index from before. A failed
          # fetch fails it: the step's bash has no pipefail.
          run_of() {
            local m
            m="$(oras manifest fetch "$1")" || return
            jq -r '.annotations["com.ioanalytica.k8s-borg.build-run"] // ""' <<<"$m"
          }
          # move_tags REF TAG… — set each TAG on REF, unless it names an index
          # of a later run: a newer release, or a newer prerelease for the
          # shared Borg UI and runtime base tags. A tag the registry does not
          # have, or one on an index from before, moves; any other answer
          # than "not found" stops the job.
          move_tags() {
            local ref="$1" image="${1%@*}" ours t now theirs err="$RUNNER_TEMP/resolve.err"
            local -a move=()
            shift
            ours="$(run_of "$ref")"
            for t in "$@"; do
              if now="$(oras resolve "$image:$t" 2>"$err")"; then
                theirs="$(run_of "$image@$now")"
                if [ -n "$theirs" ] && [ "$theirs" -gt "$ours" ]; then
                  echo "◆ $image:$t stays on $now, from the later run $theirs"
                  continue
                fi
              elif ! grep -q 'not found' "$err"; then
                cat "$err" >&2
                return 1
              fi
              move+=("$t")
            done
            [ "${#move[@]}" -eq 0 ] || oras tag "$ref" "${move[@]}"
          }
          agent="$(tags "$AGENT" "$AGENT_TAGS")"
          runtime_base="$(tags "$RUNTIME_BASE" "$RUNTIME_BASE_TAGS")"
          server="$(tags "$SERVER" "$SERVER_TAGS")"
          for ref in "$AGENT" "$RUNTIME_BASE" "$SERVER"; do
            [[ "$(run_of "$ref")" =~ ^[0-9]+$ ]] || { echo "✗ $ref names no run" >&2; exit 1; }
          done
          # A tag has no blanks: the lists split on their newlines.
          move_tags "$AGENT" $agent
          move_tags "$RUNTIME_BASE" $runtime_base
          move_tags "$SERVER" $server
      # Artifact Hub reads artifacthub-repo.yml from the tag `artifacthub.io`
      # of the chart's repository, as the layer of an ORAS artifact with these
      # media types. It reads it when a new version appears, so it goes up
      # before the chart's version. Not a semver tag: Helm, Flux and Artifact
      # Hub's own version list pass over it.
      - name: Artifact Hub repository metadata
        run: |
          oras push "$REGISTRY/$OWNER/charts/k8s-borg:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      # The tag is the version check-release-tag.sh matched against the
      # chart's.
      - name: Tag the chart
        env:
          CHART: ${{ env.REGISTRY }}/${{ env.OWNER }}/charts/k8s-borg@${{ needs.chart.outputs.digest }}
        run: oras tag "$CHART" "$GITHUB_REF_NAME"

  # The GitHub Release comes last, once the signatures verified and the tags
  # are set: a release page must not announce artifacts that fail the check
  # README.md gives users, or that cannot be pulled by their version yet. A
  # failed sign or tag job leaves no release behind; re-running it publishes
  # one.
  release:
    needs: [chart, sign, tag]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write        # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release step gets its token through the action.
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: ${{ runner.temp }}/chart
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ runner.temp }}/chart/k8s-borg-*.tgz
          # The CHANGELOG entry, followed by GitHub's generated list of pull
          # requests and the compare link.
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          # A version with a -suffix is a prerelease, never the repository's
          # Latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  # The page "Try it locally" against what this tag published: the chart at
  # the tag's version, pulled from GHCR and installed with the images it
  # names, with the page and examples/k3d/ of the tag's commit. After the
  # tagging, so the page meets the artifacts as users get them, signed and
  # tagged; beside the release, and nothing may `needs:` it: on an rc a red run
  # means the page or the release needs a fix before X.Y.Z is tagged; on
  # X.Y.Z the rc has passed the same page, and a flaky k3d run must not
  # hold up a release. The pull request that prepared the release could not
  # check this: its chart named images not published yet.
  try-locally:
    needs: tag
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: ./.github/workflows/try-locally.yml
    with:
      chart-version: ${{ github.ref_name }}
