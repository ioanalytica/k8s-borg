name: Build & push

on:
  push:
    branches: [develop, master]
    tags: ['*']

env:
  REGISTRY: ghcr.io
  OWNER: ioanalytica

jobs:
  # Read the borg version pins once and expose them to the image builds.
  # Images are built on TAG pushes only (branch pushes just lint/package the
  # chart below); gate prep and every image job on refs/tags/*.
  prep:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      runtime_tag: ${{ steps.pins.outputs.tag }}
      borg1: ${{ steps.pins.outputs.borg1 }}
      borg2: ${{ steps.pins.outputs.borg2 }}
      app_version: ${{ steps.pins.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - id: pins
        run: |
          . borg-ui/docker/runtime-base.env
          {
            echo "tag=$BORG_RUNTIME_BASE_TAG"
            echo "borg1=$BORG1_VERSION"
            echo "borg2=$BORG2_VERSION"
            # The UI app version comes from the pinned submodule, never from a
            # literal here — a hardcoded copy silently drifts on a bump, and the
            # chart would then reference an image tag that was never built.
            echo "app_version=$(tr -d '[:space:]' < borg-ui/VERSION)"
          } >> "$GITHUB_OUTPUT"

  agent:
    needs: prep
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: k8s-borg
      context: .
      file: ./docker/Dockerfile
      tags: |
        type=ref,event=branch
        type=sha,format=short
        type=semver,pattern={{version}}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

  runtime-base:
    needs: prep
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: k8s-borg-ui-runtime-base
      context: EMPTY
      file: ./docker/Dockerfile-runtime-base
      build-args: |
        BORG1_VERSION=${{ needs.prep.outputs.borg1 }}
        BORG2_VERSION=${{ needs.prep.outputs.borg2 }}
        BORGSTORE_VERSION=0.4.1
      tags: |
        type=raw,value=${{ needs.prep.outputs.runtime_tag }}
        type=ref,event=branch
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

  server:
    needs: [prep, runtime-base]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: k8s-borg-ui
      context: borg-ui
      file: ./docker/Dockerfile-server
      build-args: |
        BASE_IMAGE=ghcr.io/ioanalytica/k8s-borg-ui-runtime-base:${{ needs.prep.outputs.runtime_tag }}
        APP_VERSION=${{ needs.prep.outputs.app_version }}
      tags: |
        type=raw,value=${{ needs.prep.outputs.app_version }}
        type=ref,event=branch
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create GitHub Releases on tags
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The release step gets its token through the action, and helm gets
          # its own registry login — neither needs one left in .git/config.
          persist-credentials: false
      - uses: azure/setup-helm@v5
      - name: Lint & package
        run: |
          mkdir -p "$RUNNER_TEMP/chart"
          helm lint ./chart
          helm package ./chart --destination "$RUNNER_TEMP/chart"
      - name: Push chart to GHCR (master / tags only)
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm push "$RUNNER_TEMP"/chart/k8s-borg-*.tgz "oci://$REGISTRY/$OWNER/charts"
      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/chart/k8s-borg-*.tgz
          generate_release_notes: true
