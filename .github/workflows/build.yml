name: Build & push

on:
  push:
    branches: [develop, master]
    tags: ['*']

env:
  REGISTRY: ghcr.io
  OWNER: ioanalytica

jobs:
  # Green tests are a precondition for publishing, not a race against it. These
  # used to be two parallel workflows on the same trigger, and Build & push is
  # the faster one — on 2026-08-19 a tag push published images while the e2e
  # suite was busy failing that same commit, and pullPolicy Always pulls such
  # an image into a cluster on the next pod restart. Everything below that
  # publishes now sits downstream of this job.
  gate:
    uses: ./.github/workflows/lint-test.yml
    permissions:
      contents: read

  # Read the borg version pins once and expose them to the image builds.
  # Images are built on TAG pushes only (branch pushes just lint/package the
  # chart below); gate prep and every image job on refs/tags/*.
  prep:
    needs: gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      runtime_tag: ${{ steps.pins.outputs.tag }}
      borg1: ${{ steps.pins.outputs.borg1 }}
      borg2: ${{ steps.pins.outputs.borg2 }}
      borgstore: ${{ steps.pins.outputs.borgstore }}
      python: ${{ steps.pins.outputs.python }}
      app_version: ${{ steps.pins.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # Every image job needs this one, so failing here stops the whole release
      # instead of publishing images under a tag the chart does not carry.
      - name: Tag must match the chart version
        run: ./tests/check-release-tag.sh "$GITHUB_REF_NAME"
      - id: pins
        run: |
          . borg-ui/docker/runtime-base.env
          {
            echo "tag=$(./borg-ui/docker/runtime-base-tag.sh)"
            echo "borg1=$BORG1_VERSION"
            echo "borg2=$BORG2_VERSION"
            echo "borgstore=$BORGSTORE_VERSION"
            echo "python=$PYTHON_VERSION"
            # The UI app version comes from the pinned submodule, never from a
            # literal here — a hardcoded copy silently drifts on a bump, and the
            # chart would then reference an image tag that was never built.
            echo "app_version=$(tr -d '[:space:]' < borg-ui/VERSION)"
          } >> "$GITHUB_OUTPUT"

  agent:
    needs: prep
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: k8s-borg
      context: .
      file: ./docker/Dockerfile
      tags: |
        type=ref,event=branch
        type=sha,format=short
        type=semver,pattern={{version}}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

  runtime-base:
    needs: prep
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: k8s-borg-ui-runtime-base
      context: EMPTY
      file: ./borg-ui/Dockerfile.runtime-base
      build-args: |
        BORG1_VERSION=${{ needs.prep.outputs.borg1 }}
        BORG2_VERSION=${{ needs.prep.outputs.borg2 }}
        BORGSTORE_VERSION=${{ needs.prep.outputs.borgstore }}
        PYTHON_VERSION=${{ needs.prep.outputs.python }}
      tags: |
        type=raw,value=${{ needs.prep.outputs.runtime_tag }}
        type=ref,event=branch
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

  server:
    needs: [prep, runtime-base]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: k8s-borg-ui
      context: borg-ui
      file: ./borg-ui/Dockerfile
      build-args: |
        BASE_IMAGE=ghcr.io/ioanalytica/k8s-borg-ui-runtime-base:${{ needs.prep.outputs.runtime_tag }}
        APP_VERSION=${{ needs.prep.outputs.app_version }}
        PYTHON_VERSION=${{ needs.prep.outputs.python }}
      tags: |
        type=raw,value=${{ needs.prep.outputs.app_version }}
        type=ref,event=branch
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

  chart:
    # Publishes on master/tags and would overwrite the chart in the registry —
    # it waits for the gate like the image jobs do.
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create GitHub Releases on tags
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The release step gets its token through the action, and helm gets
          # its own registry login — neither needs one left in .git/config.
          persist-credentials: false
      - uses: azure/setup-helm@v5
      # This job does not depend on prep, so it needs the check of its own —
      # and it is the one that would do the damage: package the old version and
      # overwrite it in the registry.
      - name: Tag must match the chart version
        if: startsWith(github.ref, 'refs/tags/')
        run: ./tests/check-release-tag.sh "$GITHUB_REF_NAME"
      - name: Lint & package
        run: |
          mkdir -p "$RUNNER_TEMP/chart"
          helm lint ./chart
          helm package ./chart --destination "$RUNNER_TEMP/chart"
      - name: Push chart to GHCR (master / tags only)
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm push "$RUNNER_TEMP"/chart/k8s-borg-*.tgz "oci://$REGISTRY/$OWNER/charts"
      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/chart/k8s-borg-*.tgz
          generate_release_notes: true
