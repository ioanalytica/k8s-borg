name: Lint & test

# Standalone on branch pushes and pull requests. Tag pushes run it as the
# `gate` job inside Build & push (workflow_call) instead — that ordering is the
# point: the two used to be parallel workflows on the same trigger, so images
# published while the tests that would have failed them were still running.
# Tags are deliberately absent here, or a release would run the suite twice.
#
# Every job has a time limit: without one, a hung job holds the run for
# GitHub's default of six hours. The end-to-end limits are about twice the
# longest run seen (with a cold image cache); the short jobs get minutes.
#
# No `paths` filters on the triggers: a workflow skipped by one leaves its
# checks pending, and the ruleset on main requires them. A pull request that
# changes documentation alone skips the end-to-end jobs instead (the `changes`
# job), and a job skipped by its `if:` counts as passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Nothing here writes to the repository or the registry — the images this
# workflow builds stay on the runner.
permissions:
  contents: read

jobs:
  # Whether this run may skip the end-to-end jobs: only a pull request whose
  # every changed path is documentation (scripts/docs-only.sh) may. Branch
  # pushes and tag builds — which call this workflow from Build & push — run
  # everything, and so does a run where this job fails: the jobs below skip on
  # "true" alone.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        with:
          fetch-depth: 2   # the merge commit and both its parents
          persist-credentials: false
      - name: Documentation only?
        id: diff
        if: github.event_name == 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        # HEAD is the pull request merged into its base, HEAD^1 that base:
        # their difference is what merging would change. Without a second
        # parent HEAD is not that merge, and the step fails. A rename counts as
        # a deletion and an addition, so moving a file out of docker/ is not
        # read as adding a page of documentation.
        run: |
          git rev-parse --verify --quiet 'HEAD^2' >/dev/null
          git diff --no-renames --name-only 'HEAD^1' HEAD >"$RUNNER_TEMP/changed"
          if scripts/docs-only.sh <"$RUNNER_TEMP/changed"; then
            echo "docs-only=true" >>"$GITHUB_OUTPUT"
          fi

  chart-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Pinned: without a version the action fetches "latest" from the
      # GitHub API and silently falls back to an old Helm 3 when that fails.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - run: helm lint ./chart

  shellcheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # No job pushes anything back, so the token has no business staying
          # behind in .git/config afterwards.
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: ./tests/shellcheck.sh

  bats:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive   # chart-versions.bats describes the borg-ui pin
          persist-credentials: false
      # The UI image tag is `git describe` of the borg-ui pin; the fork the
      # submodule comes from carries no tags, so they come from upstream.
      - name: Fetch borg-ui release tags
        run: ./docker/ui-app-version.sh --fetch-tags
      - name: Install bats
        # The suite uses `run --separate-stderr`, so bats must be >= 1.5.
        # The version is printed to make a future runner-image downgrade
        # obvious in the log.
        # examples-helm.bats reads the example's HelmRelease with PyYAML.
        run: |
          sudo apt-get update && sudo apt-get install -y bats python3-yaml
          bats --version
      # chart-repo-server.bats renders the chart.
      # Pinned: without a version the action fetches "latest" from the
      # GitHub API and silently falls back to an old Helm 3 when that fails.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - run: bats --print-output-on-failure tests/

  # End-to-end against real Borg repositories, inside the agent image. Slower
  # than the jobs above (it builds the image), so it runs alongside them rather
  # than gating them. The Borg majors side by side, and Borg 2 in two parts:
  # one after the other they took 7 and 14 minutes. fail-fast off, so that a
  # failure in one job still shows the others' results.
  e2e-borg:
    name: e2e (Borg ${{ matrix.borg }}${{ matrix.part && format(', part {0}', matrix.part) || '' }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    # An image build of up to 8 minutes, then up to 8 minutes of tests.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # A job with `files` runs those files of tests/e2e, one without runs
        # all of them. Each major runs every file once (lint-test-workflow.bats),
        # so a new file goes into a part. Borg 2's parts take about as long as
        # Borg 1 (430 s): 451 s and 413 s of tests in run 41481753460.
        # `include` alone: next to a `borg:` list, an include entry would be
        # merged into that list's job instead of adding one.
        include:
          - borg: 1
          - borg: 2
            part: 1
            files: clients.bats prune.bats s3fs.bats
          - borg: 2
            part: 2
            files: repo-server-offsite.bats lifecycle.bats repo-server.bats
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive   # the agent Dockerfile builds from borg-ui/
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.2.0
      # Every job builds from the same cache, and Borg 1 alone writes it back:
      # two writers of one scope race, and the Borg 1 job still ends well
      # before e2e-db, so the export does not lengthen the run.
      - name: Build the agent image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          tags: k8s-borg:test
          load: true
          cache-from: type=gha,scope=k8s-borg-e2e
          cache-to: ${{ matrix.borg == 1 && 'type=gha,mode=max,scope=k8s-borg-e2e' || '' }}
      - name: Run the suite for Borg ${{ matrix.borg }}
        env:
          BORG_MAJOR: ${{ matrix.borg }}
          FILES: ${{ matrix.files }}
        run: |
          read -r -a files <<<"$FILES"
          SKIP_BUILD=1 ./tests/e2e/run.sh "$BORG_MAJOR" "${files[@]}"

  # The check the ruleset on main requires under the name `e2e`: passed when
  # every job of e2e-borg passed, or when a documentation-only pull request
  # skipped them. The matrix has one result, success only when every job
  # succeeded. always(), because a job skipped after a failed need reports
  # "skipped" too, which a required check counts as passed — a cancelled run
  # fails here.
  e2e:
    needs: [changes, e2e-borg]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every Borg job
        env:
          RESULT: ${{ needs.e2e-borg.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
        run: |
          echo "e2e-borg, every job: $RESULT"
          [ "$RESULT" = success ] || { [ "$RESULT" = skipped ] && [ "$DOCS_ONLY" = true ]; }

  # The database dumps and restores against real servers, every version of
  # the matrix (tests/e2e/db/run.sh). A job of its own, so that it runs next to
  # the Borg suite; the agent image comes from the same build cache.
  e2e-db:
    # Skipped like the Borg suites; required as is, since a skipped job passes.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    # MongoDB 8 is tested as 8.2 (see run.sh): 8.0.21+, 8.3 and 9.0 refuse to
    # start on a Linux kernel 6.19 or newer (SERVER-121912, SERVER-136848).
    # Back to mongo:8 once MongoDB starts there: see #68.
    runs-on: ubuntu-26.04
    # Up to 16 minutes so far. A server version that hangs is stopped by
    # run.sh after E2E_DB_TIMEOUT (10 minutes) with what it was doing; the
    # limit leaves room for that to happen first.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive   # the agent Dockerfile builds from borg-ui/
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build the agent image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          tags: k8s-borg:test
          load: true
          cache-from: type=gha,scope=k8s-borg-e2e
      - name: Build the test layer
        run: docker build -f tests/e2e/Dockerfile --build-arg BASE=k8s-borg:test -t k8s-borg:e2e .
      - name: Run the database suite, PostgreSQL 13–18, MariaDB 10.11/11.4/11.8, MySQL 8.4, Percona Server 8.4, MongoDB 7.0/8.2, Redis 7/8, Valkey 8/9
        run: ./tests/e2e/db/run.sh
