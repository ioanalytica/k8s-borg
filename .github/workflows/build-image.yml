name: build-image (reusable)

# Builds one image multi-arch WITHOUT QEMU: each platform builds natively on its
# own runner, then the per-arch digests are merged into one manifest list.
#
# Every platform image carries an SBOM and provenance as an attestation
# manifest, which the merge keeps in the index. The digest of that index is the
# workflow's output: build.yml signs it there rather than here, so that every
# certificate of a release names the one workflow, build.yml, that README.md
# tells users to verify.

on:
  workflow_call:
    outputs:
      digest:
        description: Digest of the merged multi-arch index
        value: ${{ jobs.merge.outputs.digest }}
    inputs:
      image:
        description: Short image name under ghcr.io/ioanalytica/
        required: true
        type: string
      context:
        description: Build context path, or "EMPTY" for a no-COPY Dockerfile
        required: false
        type: string
        default: "."
      file:
        description: Path to the Dockerfile
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      tags:
        description: docker/metadata-action tags config (used on the final manifest)
        required: true
        type: string
      agent-edge:
        description: Fourth agent version component to stamp into borg-ui (docker/agent-version-stamp.sh), or empty
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  OWNER: ioanalytica

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          if [ "${{ inputs.context }}" = "EMPTY" ]; then
            mkdir -p "$RUNNER_TEMP/emptyctx"
            echo "CTX=$RUNNER_TEMP/emptyctx" >> "$GITHUB_ENV"
          else
            echo "CTX=${{ inputs.context }}" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          # This job uploads artifacts, which is exactly how a token left in
          # .git/config escapes the runner. Nothing here pushes back.
          persist-credentials: false
      # Rewrites the agent version in borg-ui's pyproject.toml and
      # borg_ui_agent/__init__.py with upstream's own edge mode before the
      # build reads them: the server image serves its wheel under that version,
      # the agent image reports it.
      - name: Stamp the agent version
        if: inputs.agent-edge != ''
        env:
          AGENT_EDGE: ${{ inputs.agent-edge }}
        run: python3 borg-ui/scripts/agent_version.py edge "$AGENT_EDGE"
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}
      - id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ env.CTX }}
          file: ${{ inputs.file }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # An SPDX SBOM of the final image and SLSA v1 provenance, stated
          # rather than left to the action's defaults, which depend on the
          # repository's visibility. mode=max records the build arguments, so
          # none may carry a secret (tests/release-signing.bats).
          sbom: true
          provenance: mode=max,version=v1
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ matrix.platform }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          # "__" separator so an image name that is a prefix of another
          # (k8s-borg vs k8s-borg-ui) can't cross-match on download.
          name: digests-${{ inputs.image }}__${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}__*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}
          tags: ${{ inputs.tags }}
      - name: Create manifest list & push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index-metadata.json" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}@sha256:%s ' *)
      # The digest is the one imagetools reports for the index it pushed. Read
      # back through a tag, it could name another run's index: two releases
      # with the same borg-ui pin push the same UI and runtime base tags. From
      # here on the index is named by that digest, which is what gets signed.
      # A signature over the index covers the attestation manifests it lists,
      # so a merge that dropped one would publish a signed image without its
      # SBOM or provenance: fail instead (tests/release-signing.bats runs this
      # script).
      - name: Inspect
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}
        run: |
          digest="$(jq -r '."containerimage.descriptor".digest // empty' "$RUNNER_TEMP/index-metadata.json")"
          [[ "$digest" == sha256:* ]] || { echo "✗ imagetools create reported no digest for $IMAGE" >&2; exit 1; }
          ref="$IMAGE@$digest"
          docker buildx imagetools inspect "$ref"
          platforms="$(docker buildx imagetools inspect --raw "$ref" | jq '[.manifests[] | select(.platform.os != "unknown")] | length')"
          for att in SBOM:SPDX Provenance:SLSA; do
            docker buildx imagetools inspect "$ref" --format "{{json .${att%%:*}}}" \
              | jq -e --argjson n "$platforms" --arg kind "${att#*:}" '[.[] | select(.[$kind])] | length == $n' >/dev/null \
              || { echo "✗ $ref: not every one of its $platforms platforms has a ${att%%:*} attestation" >&2; exit 1; }
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
