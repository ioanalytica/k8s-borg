name: Set up oras
description: >-
  Installs the oras CLI at the version below, checked against the checksums of
  its release, and puts it on the PATH. A release pushes, copies and tags its
  artifacts with it (build.yml, build-image.yml).

runs:
  using: composite
  steps:
    - name: Install oras
      shell: bash
      env:
        # renovate: datasource=github-releases depName=oras-project/oras
        ORAS_VERSION: 1.3.6
      run: |
        # The jobs that use it run on x64; an arm64 runner would get a binary
        # it cannot run.
        [ "$RUNNER_OS-$RUNNER_ARCH" = Linux-X64 ] || { echo "✗ oras is installed for Linux X64 only, not $RUNNER_OS $RUNNER_ARCH" >&2; exit 1; }
        base="https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}"
        tarball="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
        sum="$(curl -fsSL "$base/oras_${ORAS_VERSION}_checksums.txt" | awk -v f="$tarball" '$2 == f { print $1 }')"
        [ -n "$sum" ] || { echo "✗ the checksums of oras $ORAS_VERSION have no $tarball" >&2; exit 1; }
        echo "$sum  $RUNNER_TEMP/$tarball" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/oras"
        tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/oras" oras
        "$RUNNER_TEMP/oras/oras" version
        echo "$RUNNER_TEMP/oras" >>"$GITHUB_PATH"
